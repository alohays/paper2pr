<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1168 300" role="img" aria-labelledby="title desc">
  <title id="title">Language models progress from words to actions</title>
  <desc id="desc">A three-stage rail compares the inputs and outputs of a Language Model, a Vision-Language Model, and a Vision-Language-Action model.</desc>
  <defs>
    <style>
      .model { font: 600 25px "Source Sans Pro", "Helvetica Neue", Arial, sans-serif; fill: #012169; }
      .eyebrow { font: 700 14px "Source Sans Pro", "Helvetica Neue", Arial, sans-serif; letter-spacing: 2px; fill: #9A7B3F; }
      .phrase { font: 400 22px "Source Sans Pro", "Helvetica Neue", Arial, sans-serif; fill: #1A1A1A; }
      .step { font: 700 16px "Source Sans Pro", "Helvetica Neue", Arial, sans-serif; fill: #FFFFFF; }
      .rail { stroke: #B9975B; stroke-width: 4; fill: none; }
      .guide { stroke: #D6DEE9; stroke-width: 2; fill: none; }
    </style>
    <marker id="rail-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#B9975B"/>
    </marker>
    <marker id="down-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#B9975B"/>
    </marker>
  </defs>

  <line class="rail" x1="72" y1="92" x2="1096" y2="92" marker-end="url(#rail-arrow)"/>

  <g transform="translate(188 0)">
    <text class="model" x="0" y="34" text-anchor="middle">Language Model (LM)</text>
    <circle cx="0" cy="92" r="23" fill="#012169" stroke="#FFFFFF" stroke-width="5"/>
    <text class="step" x="0" y="98" text-anchor="middle">1</text>
    <text class="eyebrow" x="0" y="145" text-anchor="middle">INPUT</text>
    <text class="phrase" x="0" y="174" text-anchor="middle">text in</text>
    <line class="rail" x1="0" y1="188" x2="0" y2="215" marker-end="url(#down-arrow)"/>
    <text class="eyebrow" x="0" y="244" text-anchor="middle">OUTPUT</text>
    <text class="phrase" x="0" y="276" text-anchor="middle">next word out</text>
  </g>

  <g transform="translate(584 0)">
    <text class="model" x="0" y="34" text-anchor="middle">Vision-Language Model (VLM)</text>
    <circle cx="0" cy="92" r="23" fill="#012169" stroke="#FFFFFF" stroke-width="5"/>
    <text class="step" x="0" y="98" text-anchor="middle">2</text>
    <text class="eyebrow" x="0" y="145" text-anchor="middle">INPUT</text>
    <text class="phrase" x="0" y="174" text-anchor="middle">image + text in</text>
    <line class="rail" x1="0" y1="188" x2="0" y2="215" marker-end="url(#down-arrow)"/>
    <text class="eyebrow" x="0" y="244" text-anchor="middle">OUTPUT</text>
    <text class="phrase" x="0" y="276" text-anchor="middle">words about the world out</text>
  </g>

  <g transform="translate(975 0)">
    <text class="model" x="0" y="34" text-anchor="middle">Vision-Language-Action (VLA)</text>
    <circle cx="0" cy="92" r="23" fill="#012169" stroke="#FFFFFF" stroke-width="5"/>
    <text class="step" x="0" y="98" text-anchor="middle">3</text>
    <text class="eyebrow" x="0" y="145" text-anchor="middle">INPUT</text>
    <text class="phrase" x="0" y="174" text-anchor="middle">observation + instruction in</text>
    <line class="rail" x1="0" y1="188" x2="0" y2="215" marker-end="url(#down-arrow)"/>
    <text class="eyebrow" x="0" y="244" text-anchor="middle">OUTPUT</text>
    <text class="phrase" x="0" y="276" text-anchor="middle">next action out</text>
  </g>

  <line class="guide" x1="386" y1="124" x2="386" y2="286"/>
  <line class="guide" x1="782" y1="124" x2="782" y2="286"/>
</svg>
