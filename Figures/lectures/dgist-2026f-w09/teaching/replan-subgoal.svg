<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1168 430" role="img" aria-labelledby="replan-subgoal-title replan-subgoal-desc"><title id="replan-subgoal-title">Observed result revises the next subgoal</title><desc id="replan-subgoal-desc">Left panel: after the robot tries to place the cup, the observation shows the cup on the counter beside the coffee machine, not under the dispenser. Right panel: the revised next step places the cup under the dispenser before brewing. An arrow leads from the observed result to the revised step.</desc><defs><marker id="replan-subgoal-arrow" viewBox="0 0 10 10" refX="4" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#B9975B"/></marker></defs><rect width="1168" height="430" fill="white"/><g transform="translate(120.5 40) scale(1.3)"><rect x="28" y="10" width="156" height="148" rx="10" fill="white" stroke="#012169" stroke-width="2.5"/><path d="M28 52 H184" fill="none" stroke="#012169" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="51" cy="31" r="6" fill="#012169" stroke="#012169" stroke-width="3"/><path d="M80 31 H143" fill="none" stroke="#012169" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M64 52 V75 H164 V52 M116 75 V89" fill="none" stroke="#012169" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(252 121.5) scale(0.65)"><path d="M5 8 H65 V49 Q65 63 50 63 H20 Q5 63 5 49 Z" fill="none" stroke="#012169" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M65 18 H76 C96 18 96 48 76 48 H65" fill="none" stroke="#012169" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 70 H80" fill="none" stroke="#012169" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M42 149 H170" fill="none" stroke="#012169" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 167 H322" fill="none" stroke="#012169" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(660.5 40) scale(1.3)"><rect x="28" y="10" width="156" height="148" rx="10" fill="white" stroke="#012169" stroke-width="2.5"/><path d="M28 52 H184" fill="none" stroke="#012169" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="51" cy="31" r="6" fill="#012169" stroke="#012169" stroke-width="3"/><path d="M80 31 H143" fill="none" stroke="#012169" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M64 52 V75 H164 V52 M116 75 V89" fill="none" stroke="#012169" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(87 89) scale(0.65)"><path d="M5 8 H65 V49 Q65 63 50 63 H20 Q5 63 5 49 Z" fill="none" stroke="#012169" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M65 18 H76 C96 18 96 48 76 48 H65" fill="none" stroke="#012169" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 70 H80" fill="none" stroke="#012169" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M42 149 H170" fill="none" stroke="#012169" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 167 H322" fill="none" stroke="#012169" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M563 150 H631" fill="none" stroke="#012169" stroke-width="4" stroke-linecap="butt" marker-end="url(#replan-subgoal-arrow)"/><text x="335" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#012169">Observed result</text><text x="335" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="400" fill="#56606E">The cup is not under the dispenser</text><text x="875" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#012169">Revised next step</text><text x="875" y="370" text-anchor="middle" font-family="Arial, sans