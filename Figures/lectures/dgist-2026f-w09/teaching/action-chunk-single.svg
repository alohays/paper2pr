<svg id="w09-action-chunk-single" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1168 430" role="img" aria-labelledby="w09-action-chunk-single-title w09-action-chunk-single-desc"><title id="w09-action-chunk-single-title">ACT predicts a short sequence of joint targets</title><desc id="w09-action-chunk-single-desc">Images and current robot state enter ACT, which predicts a short sequence of joint-position targets. Four slots labelled Now, Next, Then and Later illustrate successive movement commands, not a semantic task plan. No numerical target values or measured timing are implied. Overlap and temporal ensembling are not introduced in this first diagram.</desc>
