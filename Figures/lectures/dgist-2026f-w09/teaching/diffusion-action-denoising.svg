<title id="w09-diffusion-action-denoising-title">Diffusion Policy refines a whole action chunk: the same eight future commands shown as numbers and as planned pusher positions on the push-T table</title>
<desc id="w09-diffusion-action-denoising-desc">Schematic: the eight one-dimensional values and the dot paths on a stylised top view of the push-T table are illustrative, not model output or a recorded trajectory.</desc>
<style>#w09-diffusion-action-denoising text{font-family:inherit} #w09-diffusion-action-denoising [data-panel-step]{visibility:hidden;opacity:0} #w09-diffusion-action-denoising [data-panel-step].is-active{visibility:visible;opacity:1}</style>
