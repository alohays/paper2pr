<text x="597" y="103" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="middle" fill="#111111">t + 1</text>
<text x="740" y="103" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="middle" fill="#111111">t + 2</text>
<text x="883" y="103" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="middle" fill="#111111">t + 3</text>
<text x="1026" y="103" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="middle" fill="#111111">t + 4</text>
<text x="161" y="167" font-family="Arial, sans-serif" font-size="36" font-weight="400" text-anchor="middle" fill="#012169">Predict at t</text>
<rect x="417" y="133" width="75" height="48" rx="4" fill="#F2F3F5" stroke="#A8B1BE" stroke-width="2"/>
<rect x="560" y="133" width="75" height="48" rx="4" fill="#F2F3F5" stroke="#A8B1BE" stroke-width="2"/>
