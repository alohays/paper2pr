<rect x="560" y="206" width="75" height="48" rx="4" fill="#F2F3F5" stroke="#A8B1BE" stroke-width="2"/>
<rect x="703" y="206" width="75" height="48" rx="4" fill="#F2F3F5" stroke="#B9975B" stroke-width="4"/>
<rect x="846" y="206" width="75" height="48" rx="4" fill="#F2F3F5" stroke="#A8B1BE" stroke-width="2"/>
<rect x="989" y="206" width="75" height="48" rx="4" fill="#F2F3F5" stroke="#A8B1BE" stroke-width="2"/>
<text x="161" y="313" font-family="Arial, sans-serif" font-size="36" font-weight="400" text-anchor="middle" fill="#012169">Predict at t + 2</text>
<rect x="703" y="279" width="75" height="48" rx="4" fill="#F2F3F5" stroke="#B9975B" stroke-width="4"/>
