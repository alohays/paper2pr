<svg id="w09-action-chunks" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1168 430" role="img" aria-labelledby="w09-action-chunks-title w09-action-chunks-desc"><title id="w09-action-chunks-title">Action chunks and overlapping estimates</title><desc id="w09-action-chunks-desc">Each observation can produce a future action chunk. Overlapping chunks include estimates for the same execution time. ACT temporal ensembling combines those same-time estimates.</desc>
