<rect width="1168" height="430" fill="white"/>
<text x="125" y="55" font-family="Arial, sans-serif" font-size="34" font-weight="600" text-anchor="middle" fill="#012169">Observe</text>
<text x="784" y="55" font-family="Arial, sans-serif" font-size="34" font-weight="600" text-anchor="middle" fill="#012169">Future execution time</text>
