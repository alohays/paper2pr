<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1168 430" role="img" aria-labelledby="design-feedback-loop-title design-feedback-loop-desc"><title id="design-feedback-loop-title">Agent and environment: observe, choose, act</title><desc id="design-feedback-loop-desc">Sensors receive observations of a coffee machine and cup. The policy selects actions, actuators execute them, and the changed world is observed again. The coffee scene represents the environment; it is not a second agent. Teaching adaptation of UC Berkeley CS188.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs><rect width="1168" height="430" fill="white"/><rect x="24" y="18" width="464" height="390" rx="20" fill="white" stroke="#012169" stroke-width="2.5"/><rect x="808" y="18" width="336" height="390" rx="20" fill="white" stroke="#012169" stroke-width="2.5"/><text x="62" y="76" text-anchor="start" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#012169">Agent</text><text x="976" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#012169">Environment</text><text x="252" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="400" fill="#012169">Sensors</text><rect x="138" y="201" width="228" height="76" rx="10" fill="#F3EBDC" stroke="#B9975B" stroke-width="2.5"/><text x="252" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="600" fill="#012169">Policy</text><text x="252" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="400" fill="#012169">Actuators</text><g transform="translate(869 169) scale(1)"><rect x="28" y="10" width="156" height="148" rx="10" fill="white" stroke="#012169" stroke-width="2.5"/><path d="M28 52 H184" fill="none" stroke="#012169" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="51" cy="31" r="6" fill="#B9975B" stroke="#B9975B" stroke-width="3"/><path d="M80 31 H143" fill="none" stroke="#012169" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M64 52 V75 H164 V52 M116 75 V89" fill="none" stroke="#012169" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(87 89) scale(0.65)"><path d="M5 8 H65 V49 Q65 63 50 63 H20 Q5 63 5 49 Z" fill="none" stroke="#012169" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M65 18 H76 C96 18 96 48 76 48 H65" fill="none" stroke="#012169" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 70 H80" fill="none" stroke="#012169" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 42 H56" fill="none" stroke="#B9975B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M42 149 H170" fill="none" stroke="#012169" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 167 H221" fill="none" stroke="#012169" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="645" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="400" fill="#012169">Observations</text><text x="645" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="400" fill="#012169">Actions</text><path d="M850 142 H374" fill="none" stroke="#012169" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M252 163 V191" fill="none" stroke="#012169" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M252 283 V314" fill="none" stroke="#012169" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M379 350 H850" fill="none" stroke="#012169" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker