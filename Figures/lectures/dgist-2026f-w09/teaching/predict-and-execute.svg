<svg id="w09-predict-and-execute" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1168 430" role="img" aria-labelledby="w09-predict-and-execute-title w09-predict-and-execute-desc"><title id="w09-predict-and-execute-title">Predict a sequence and execute a prefix</title><desc id="w09-predict-and-execute-desc">A policy predicts several future actions. Execute only a short prefix, get a new observation and predict a new sequence. Prediction horizon and execution horizon are distinct.</desc>
