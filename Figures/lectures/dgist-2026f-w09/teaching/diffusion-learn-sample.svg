<svg xmlns="http://www.w3.org/2000/svg" id="w09-diffusion-learn-sample" viewBox="0 0 1168 420" role="img" aria-labelledby="w09-diffusion-learn-sample-title" class="mechanism-svg"><title id="w09-diffusion-learn-sample-title">Diffusion training predicts known injected noise; generation iteratively updates noisy data with a trained model.</title><style>#w09-diffusion-learn-sample text{font-family:inherit} #w09-diffusion-learn-sample [data-panel-step]{visibility:hidden;opacity:0} #w09-diffusion-learn-sample [data-panel-step].is-active{visibility:visible;opacity:1} #w09-diffusion-learn-sample [data-move-x]{transition:transform .55s ease-in-out} @media(prefers-reduced-motion:reduce){#w09-diffusion-learn-sample [data-move-x]{transition:none}}</style><g data-panel-step="0" class="is-active"><text x="584" y="42" font-size="38" fill="#012169" text-anchor="middle" font-weight="700">Training: add known random noise</text><rect x="20" y="142" width="345" height="94" rx="5" fill="#e7edf5" stroke="#012169" stroke-width="2" /><text x="192" y="201" font-size="36" fill="#012169" text-anchor="middle" font-weight="700">Image</text><rect x="410" y="142" width="345" height="94" rx="5" fill="#f3ebdc" stroke="#b9975b" stroke-width="2" /><text x="582" y="201" font-size="36" fill="#012169" text-anchor="middle" font-weight="700">+ noise</text><rect x="800" y="142" width="345" height="94" rx="5" fill="#e7edf5" stroke="#012169" stroke-width="2" /><text x="972" y="201" font-size="36" fill="#012169" text-anchor="middle" font-weight="700">Noisy image</text><line x1="365" y1="189" x2="398" y2="189" stroke="#012169" stroke-width="3"/><text x="382" y="179" font-size="32" fill="#012169" text-anchor="middle">→</text><line x1="755" y1="189" x2="788" y2="189" stroke="#012169" stroke-width="3"/><text x="772" y="179" font-size="32" fill="#012169" text-anchor="middle">→</text><text x="584" y="323" font-size="34" fill="#012169" text-anchor="middle">We know exactly which noise was added</text></g><g data-panel-step="1" class=""><text x="584" y="42" font-size="38" fill="#012169" text-anchor="middle" font-weight="700">Training: predict the added noise</text><rect x="20" y="142" width="345" height="94" rx="5" fill="#e7edf5" stroke="#012169" stroke-width="2" /><text x="192" y="201" font-size="36" fill="#012169" text-anchor="middle" font-weight="700">Noisy image</text><rect x="410" y="142" width="345" height="94" rx="5" fill="#f3ebdc" stroke="#b9975b" stroke-width="2" /><text x="582" y="201" font-size="36" fill="#012169" text-anchor="middle" font-weight="700">Model</text><rect x="800" y="142" width="345" height="94" rx="5" fill="#e7edf5" stroke="#012169" stroke-width="2" /><text x="972" y="201" font-size="36" fill="#012169" text-anchor="middle" font-weight="700">Noise estimate</text><line x1="365" y1="189" x2="398" y2="189" stroke="#012169" stroke-width="3"/><text x="382" y="179" font-size="32" fill="#012169" text-anchor="middle">→</text><line x1="755" y1="189" x2="788" y2="189" stroke="#012169" stroke-width="3"/><text x="772" y="179" font-size="32" fill="#012169" text-anchor="middle">→</text><text x="584" y="323" font-size="34" fill="#012169" text-anchor="middle">Compare the estimate with that known noise</text><text x="584" y="385" font-size="32" fill="#61728a" text-anchor="middle">The model also receives the noise level</text></g><g data-panel-step="2" class=""><text x="584" y="42" font-size="38" fill="#012169" text-anchor="middle" font-weight="700">Generation: repeat learned updates</text><rect x="20" y="142" width="345" height="94" rx="5" fill="#e7edf5" stroke="#012169" stroke-width="2" /><text x="192" y="201" font-size="36" fill="#012169" text-anchor="middle" font-weight="700">Random noise</text><rect x="410" y="142" width="345" height="94" rx="5" fill="#f3ebdc" stroke="#b9975b" stroke-width="2" /><text x="582" y="201" font-size="36" fill="#012169" text-anchor="middle" font-weight="700">Model updates</text><rect x="800" y="142" width="345" height="94" rx="5" fill="#e7edf5" stroke="#012169" stroke-width="2" /><text x="972" y="201" font-size="36" fill="#012169" text-anchor="middle" font-weight="700">New image</text><line x1="365" y1="189" x2="398" y2="189" stroke="#012169" stroke-width="3"/><text x="382" y="179" font-size="32" fill="#012169" text-anchor="middle">→</text><line x1="755" y1="189" x2="788" y2="189" stroke="#012169" stroke-width="3"/><text x="772" y="179" font-size="32" fill="#012169" text-anchor="middle">→</text><text x="584" y="323" font-size="34" fill="#012169" text-anchor="middle">Reuse the trained model; do not train again</text><text x="584" y="385" font-size="32" fill="#61728a" text-anchor="middle">Noise level changes with each update</text></g></svg>