<svg xmlns="http://www.w3.org/2000/svg" id="w09-recap-experience" class="mechanism-svg" viewBox="0 0 1168 430" role="img" aria-labelledby="w09-recap-experience-title w09-recap-experience-desc"><title id="w09-recap-experience-title">Layers of experience</title><desc id="w09-recap-experience-desc">Schematic of three layers of experience, from broad pretraining through coffee demonstrations to the robot's own attempts with expert corrections, with the last two tagged by the learning signals from chapter 2.</desc>
