<svg id="w09-behavior-cloning" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1168 430" role="img" aria-labelledby="w09-behavior-cloning-title w09-behavior-cloning-desc"><title id="w09-behavior-cloning-title">Behavior cloning uses aligned examples</title><desc id="w09-behavior-cloning-desc">The observation and expert action are recorded at the same time. The policy predicts an action from that observation and learns by comparing its output with the expert action.</desc>
