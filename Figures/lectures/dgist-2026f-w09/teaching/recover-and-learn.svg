<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1168 430" role="img" aria-labelledby="recover-and-learn-title recover-and-learn-desc"><title id="recover-and-learn-title">Immediate recovery and later learning</title><desc id="recover-and-learn-desc">Now the robot uses fresh observations to adjust motion or the next task. Later, collected attempts and outcomes can train an improved model. These are distinct processes.</desc><defs><marker id="recover-and-learn-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#012169"/></marker></defs><rect width="1168" height="430" fill="white"/><text x="130" y="117" font-family="Arial, sans-serif" font-size="40" font-weight="600" fill="#012169" text-anchor="middle">NOW</text><text x="735" y="90" font-family="Arial, sans-serif" font-size="40" font-weight="600" fill="#012169" text-anchor="middle">Observe again</text><text x="735" y="147" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#012169" text-anchor="middle">Adjust the motion or next task</text><path d="M70 210H1098" stroke="#D3DBE6" stroke-width="2"/><text x="130" y="304" font-family="Arial, sans-serif" font-size="40" font-weight="600" fill="#012169" text-anchor="middle">LATER</text><text x="735" y="279" font-family="Arial, sans-serif" font-size="40" font-weight="600" fill="#012169" text-anchor="middle">Learn from the attempt</text><text x="735" y="336" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#012169" text-anchor="middle">Train and deploy an improved model</text></svg>