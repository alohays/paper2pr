<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1168 430" role="img" aria-labelledby="research-directions-title research-directions-desc"><title id="research-directions-title">Compatible routes from learned knowledge to robot behavior</title><desc id="research-directions-desc">Three selected complementary directions: connect requests to actions, predict consequences, and plan subgoals. They can coexist in one system and are not a historical replacement ladder.</desc><defs><marker id="research-directions-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#012169"/></marker></defs><rect width="1168" height="430" fill="white"/><text x="205" y="185" font-family="Arial, sans-serif" font-size="40" font-weight="600" fill="#012169" text-anchor="middle">Learned</text><text x="205" y="237" font-family="Arial, sans-serif" font-size="40" font-weight="600" fill="#012169" text-anchor="middle">knowledge</text><path d="M350 205H400V80H478" fill="none" stroke="#012169" stroke-width="3" marker-end="url(#research-directions-arrow)"/><path d="M350 205H478" fill="none" stroke="#012169" stroke-width="3" marker-end="url(#research-directions-arrow)"/><path d="M400 205V330H478" fill="none" stroke="#012169" stroke-width="3" marker-end="url(#research-directions-arrow)"/><text x="510" y="78" font-family="Arial, sans-serif" font-size="40" font-weight="600" fill="#012169" text-anchor="start">Follow requests</text><text x="510" y="121" font-family="Arial, sans-serif" font-size="34" font-weight="400" fill="#56606E" text-anchor="start">“Bring the blue cup.”</text><text x="510" y="203" font-family="Arial, sans-serif" font-size="40" font-weight="600" fill="#012169" text-anchor="start">Predict consequences</text><text x="510" y="246" font-family="Arial, sans-serif" font-size="34" font-weight="400" fill="#56606E" text-anchor="start">“Will the milk spill?”</text><text x="510" y="328" font-family="Arial, sans-serif" font-size="40" font-weight="600" fill="#012169" text-anchor="start">Plan the next task</text><text x="510" y="371" font-family="Arial, sans-serif" font-size="34" font-weight="400" fill="#56606E" text-anchor="start">“Place the cup before brewing.”</text></svg>