<svg id="w09-recap-learning-loop" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1168 430" role="img" aria-labelledby="w09-recap-learning-loop-title w09-recap-learning-loop-desc"><title id="w09-recap-learning-loop-title">RECAP improves the next deployed policy</title><desc id="w09-recap-learning-loop-desc">Collect robot trials and human corrections, learn a value model from outcomes, train advantage-conditioned VLA actions and deploy the updated policy. Repeat collection with the new version.</desc>
