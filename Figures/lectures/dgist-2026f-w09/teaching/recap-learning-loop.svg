<text x="440.0" y="229.0" font-family="Arial, sans-serif" font-size="30" font-weight="400" text-anchor="middle" fill="#56606E">Learn value</text>
<path d="M 562 199 L 596 199" fill="none" stroke="#012169" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#w09-recap-learning-loop-arrow)"/>
