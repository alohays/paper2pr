<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1168 430" role="img" aria-labelledby="design-dual-system-title design-dual-system-desc"><title id="design-dual-system-title">Separate planning and execution with feedback</title><desc id="design-dual-system-desc">The request enters System 2, which chooses goals and replans. A subgoal goes to separate System 1, which executes actions in the coffee environment. Real-world feedback goes to both System 2 and System 1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs><rect width="1168" height="430" fill="white"/><rect x="443" y="20" width="448" height="116" rx="12" fill="white" stroke="#012169" stroke-width="2.5"/><text x="667" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="600" fill="#012169">System 2: Plan</text><text x="667" y="113" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#56606E">Goals + replanning</text><rect x="443" y="245" width="448" height="115" rx="12" fill="#F3EBDC" stroke="#B9975B" stroke-width="2.5"/><text x="667" y="293" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="600" fill="#012169">System 1: Act</text><text x="667" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#56606E">Skill execution</text><text x="151" y="201" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="600" fill="#012169">Real world</text><g transform="translate(59 218) scale(0.81)"><rect x="28" y="10" width="156" height="148" rx="10" fill="white" stroke="#012169" stroke-width="2.5"/><path d="M28 52 H184" fill="none" stroke="#012169" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="51" cy="31" r="6" fill="#B9975B" stroke="#B9975B" stroke-width="3"/><path d="M80 31 H143" fill="none" stroke="#012169" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M64 52 V75 H164 V52 M116 75 V89" fill="none" stroke="#012169" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(87 89) scale(0.65)"><path d="M5 8 H65 V49 Q65 63 50 63 H20 Q5 63 5 49 Z" fill="none" stroke="#012169" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M65 18 H76 C96 18 96 48 76 48 H65" fill="none" stroke="#012169" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 70 H80" fill="none" stroke="#012169" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 42 H56" fill="none" stroke="#B9975B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M42 149 H170" fill="none" stroke="#012169" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 167 H221" fill="none" stroke="#012169" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1034" y="39" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#012169">Request</text><text x="1034" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#012169">Make coffee</text><path d="M969 112 H903" fill="none" stroke="#012169" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M667 136 V232" fill="none" stroke="#012169" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="771" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#012169">Subgoal</text><path d="M150 163 V79 H431" fill="none" stroke="#012169" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="270" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#012169">Feedback</text><path d="M256 281 H431" fill="none" stroke="#012169" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="341" y="257" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#012169">Observe</text><path d="M667 360 V406 H151 V372" fill="none" stroke="#012169" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="283" y="378" width="169" height="50" rx="0" fill="white" stroke="white" stroke-width="2.5"/><text x="367" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#012169">Actions</text></svg>
