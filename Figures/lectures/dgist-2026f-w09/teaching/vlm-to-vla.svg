<svg xmlns="http://www.w3.org/2000/svg" id="w09-vlm-to-vla" class="mechanism-svg" viewBox="0 0 1168 430" role="img" aria-labelledby="w09-vlm-to-vla-title w09-vlm-to-vla-desc"><title id="w09-vlm-to-vla-title">A VLM answers in text; an action head turns it into a VLA</title><desc id="w09-vlm-to-vla-desc">Schematic: the photo is a real frame from a robot demonstration video, but the question, the text reply and the four action cells are illustrative, not recorded model output.</desc>
