<svg id="w09-experience-learning-action" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1168 430" role="img" aria-labelledby="w09-experience-learning-action-title w09-experience-learning-action-desc"><title id="w09-experience-learning-action-title">From experience through learning to action</title><desc id="w09-experience-learning-action-desc">Experience provides training data, a learning signal changes the model, and the learned system produces action. Acting can supply new experience for later learning. Execution feedback and training updates occur at different stages.</desc>
