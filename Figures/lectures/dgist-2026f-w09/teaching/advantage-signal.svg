<svg xmlns="http://www.w3.org/2000/svg" id="w09-advantage-signal" class="mechanism-svg" viewBox="0 0 1168 430" role="img" aria-labelledby="w09-advantage-signal-title w09-advantage-signal-desc"><title id="w09-advantage-signal-title">Better or worse than expected</title><desc id="w09-advantage-signal-desc">Schematic only: two recorded attempts, one action tagged better than the expected score and one tagged worse, with both tags used to train the next policy; the marker positions are illustrative, not measured.</desc>
<style>#w09-advantage-signal text{font-family:inherit} #w09-advantage-signal [data-panel-step]{visibility:hidden;opacity:0} #w09-advantage-signal [data-panel-step].is-active{visibility:visible;opacity:1}</style>
<defs><marker id="w09-advantage-signal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#012169"/></marker></defs>
<rect width="1168" height="430" fill="white"/>
<rect x="30" y="44" width="520" height="210" rx="8" fill="white" stroke="#012169" stroke-width="2"/>
<text x="54" y="84" font-size="32" font-weight="700" fill="#012169">Attempt A</text>
<text x="54" y="124" font-size="30" fill="#012169">Tool fitted on the first try</text>
<path d="M70 186 H510" fill="none" stroke="#A8B1BE" stroke-width="3" stroke-linecap="round"/>
<path d="M290 178 V194" fill="none" stroke="#012169" stroke-width="3" stroke-linecap="round"/>
<text x="290" y="218" font-size="26" text-anchor="middle" fill="#56606E">expected</text>
<circle cx="400" cy="186" r="13" fill="#B9975B"/>
<text x="400" y="166" font-size="28" font-weight="700" text-anchor="middle" fill="#9A7B3F">better ↑</text>
<rect x="618" y="44" width="520" height="210" rx="8" fill="white" stroke="#012169" stroke-width="2"/>
<text x="642" y="84" font-size="32" font-weight="700" fill="#012169">Attempt B</text>
<text x="642" y="124" font-size="30" fill="#012169">Tool dropped, then retried</text>
<path d="M658 186 H1098" fill="none" stroke="#A8B1BE" stroke-width="3" stroke-linecap="round"/>
<path d="M878 178 V194" fill="none" stroke="#012169" stroke-width="3" stroke-linecap="round"/>
<text x="878" y="218" font-size="26" text-anchor="middle" fill="#56606E">expected</text>
<circle cx="768" cy="186" r="13" fill="#C8553D"/>
<text x="768" y="166" font-size="28" font-weight="700" text-anchor="middle" fill="#C8553D">worse ↓</text>
<g data-panel-step="0" class="is-active">
<text x="584" y="310" font-size="30" font-weight="600" text-anchor="middle" fill="#012169">Compare each recorded action with the score expected there</text>
<text x="584" y="352" font-size="28" text-anchor="middle" fill="#56606E">The tag is the learning signal, not a replay of successes</text>
</g>
<g data-panel-step="1" class="">
<path d="M290 256 V327 H380" fill="none" stroke="#012169" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#w09-advantage-signal-arrow)"/>
<path d="M878 256 V327 H788" fill="none" stroke="#012169" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#w09-advantage-signal-arrow)"/>
<rect x="384" y="292" width="400" height="70" rx="8" fill="#f3ebdc" stroke="#b9975b" stroke-width="2"/>
<text x="584" y="336" font-size="32" font-weight="700" text-anchor="middle" fill="#012169">Train the next policy</text>
<text x="584" y="410" font-size="30" font-weight="600" text-anchor="middle" fill="#012169">Both tags are used; at run time, ask for ‘better’</text>
</g>
</svg>
