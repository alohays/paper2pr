" height="56" rx="5" fill="#fff" stroke="#012169" stroke-width="2" /><text x="1049.0" y="188" font-size="30" fill="#012169" text-anchor="middle" font-weight="700">new</text><text x="1049" y="91" font-size="27" fill="#61728a" text-anchor="middle">200</text><text x="1049" y="130" font-size="30" fill="#012169" text-anchor="middle" font-weight="700">B7</text><text x="22" y="91" font-size="28" fill="#61728a" text-anchor="start">Time / ms</text><text x="22" y="130" font-size="30" fill="#012169" text-anchor="start" font-weight="700">New chunk</text><text x="390" y="263" font-size="30" fill="#b9975b" text-anchor="middle" font-weight="700">Executed by A</text><text x="660" y="263" font-size="30" fill="#012169" text-anchor="middle" font-weight="700">Can change</text><text x="952" y="263" font-size="30" fill="#012169" text-anchor="middle" font-weight="700">New future</text><rect x="772" y="139" width="328" height="149" rx="5" fill="none" stroke="#b9975b" stroke-width="2" /><text x="584" y="352" font-size="32" fill="#012169" text-anchor="middle" font-weight="700">B5, B6 and B7 extend beyond the old chunk</text><text x="584" y="402" font-size="30" fill="#61728a" text-anchor="middle">Asynchronous scheduling alone does not ensure continuity</text></g></svg>