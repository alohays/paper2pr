00">B7</text><text x="22" y="91" font-size="28" fill="#61728a" text-anchor="start">Time / ms</text><text x="22" y="130" font-size="30" fill="#012169" text-anchor="start" font-weight="700">New chunk</text><text x="390" y="263" font-size="30" fill="#b9975b" text-anchor="middle" font-weight="700">Executed by A</text><text x="660" y="263" font-size="30" fill="#012169" text-anchor="middle" font-weight="700">Can change</text><text x="952" y="263" font-size="30" fill="#012169" text-anchor="middle" font-weight="700">New future</text><rect x="222" y="139" width="328" height="149" rx="5" fill="none" stroke="#b9975b" stroke-width="2" /><text x="584" y="352" font-size="32" fill="#012169" text-anchor="middle" font-weight="700">B0, B1 and B2 are fixed to A3, A4 and A5</text><text x="584" y="402" font-size="30" fill="#61728a" text-anchor="middle">Asynchronous scheduling alone does not ensure continuity</text></g><g data-panel-step="1" class=""><text x="584" y="42" font-size="36" fill="#012169" text-anchor="middle" font-weight="700">Keep later overlap close, while allowing corrections</text><rect x="228" y="150" width="102" height="56" rx="5" fill="#f3ebdc" stroke="#b9975b" stroke-width="2" /><text x="279.0" y="188" font-size="30" fill="#012169" text-anchor="middle" font-weight="700">A3</text><text x="279" y="91" font-size="27" fill="#61728a" text-anchor="middle">60</text><text x="279" y="130" font-size="30" fill="#012169" text-anchor="middle" font-weight="700">B0</text><rect x="338" y="150" width="102" height="56" rx="5" fill="#f3ebdc" stroke="#b9975b" stroke-width="2" /><text x="389.0" y="188" font-size="30" fill="#012169" text-anchor="middle" font-weight="700">A4</text><text x="389" y="91" font-size="27" fill="#61728a" text-anchor="middle">80</text><text x="389" y="130" font-size="30" fill="#012169" text-anchor="middle" font-weight="700">B1</text><rect x="448" y="150" width="102" height="56" rx="5" fill="#f3ebdc" stroke="#b9975b" stroke-width="2" /><text x="499.0" y="188" font-s