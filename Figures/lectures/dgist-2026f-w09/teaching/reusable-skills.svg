<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1168 430" role="img" aria-labelledby="reusable-skills-title reusable-skills-desc"><title id="reusable-skills-title">Toward reusable skills</title><desc id="reusable-skills-desc">A research direction from task-focused experience toward broad pretraining and reusable abilities; adaptation may still be necessary.</desc><defs><marker id="reusable-skills-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#012169"/></marker></defs><rect width="1168" height="430" fill="white"/><text x="254" y="120" font-family="Arial, sans-serif" font-size="40" font-weight="600" fill="#012169" text-anchor="middle">Task-focused learning</text><text x="254" y="181" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#012169" text-anchor="middle">One setting</text><text x="254" y="229" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#012169" text-anchor="middle">One trained task</text><path d="M485 175H665" fill="none" stroke="#012169" stroke-width="3" marker-end="url(#reusable-skills-arrow)"/><text x="911" y="120" font-family="Arial, sans-serif" font-size="40" font-weight="600" fill="#012169" text-anchor="middle">Broader pretraining</text><text x="911" y="181" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#012169" text-anchor="middle">Varied experiences</text><text x="911" y="229" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#012169" text-anchor="middle">Reusable abilities</text><text x="584" y="335" font-family="Arial, sans-serif" font-size="38" font-weight="400" fill="#56606E" text-anchor="middle">New tasks may still need adaptation.</text></svg>