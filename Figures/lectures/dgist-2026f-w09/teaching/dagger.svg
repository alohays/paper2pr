<svg id="w09-dagger" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1168 430" role="img" aria-labelledby="w09-dagger-title w09-dagger-desc"><title id="w09-dagger-title">DAgger gathers expert labels on visited states</title><desc id="w09-dagger-desc">Run the current policy, query expert actions on states it visits, merge the new pairs with previous data and retrain. Repeat with the updated policy. Queries are not limited to failures.</desc>
<defs><marker id="w09-dagger-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#012169"/></marker><marker id="w09-dagger-gold-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B9975B"/></marker></defs>
<rect width="1168" height="430" fill="white"/>
<text x="584" y="53" font-family="Arial, sans-serif" font-size="38" font-weight="600" text-anchor="middle" fill="#012169">Learn on the states the robot actually visits</text>
<rect x="30" y="140" width="244" height="120" rx="8" fill="#FFFFFF" stroke="#012169" stroke-width="2"/>
<text x="152.0" y="197.0" font-family="Arial, sans-serif" font-size="36" font-weight="600" text-anchor="middle" fill="#012169">Run policy</text>
<text x="152.0" y="235.0" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="middle" fill="#56606E">Visit states</text>
<path d="M 274 200 L 308 200" fill="none" stroke="#012169" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#w09-dagger-arrow)"/>
<rect x="318" y="140" width="244" height="120" rx="8" fill="#FFFFFF" stroke="#012169" stroke-width="2"/>
<text x="440.0" y="197.0" font-family="Arial, sans-serif" font-size="36" font-weight="600" text-anchor="middle" fill="#012169">Query expert</text>
<text x="440.0" y="235.0" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="middle" fill="#56606E">Get actions</text>
<path d="M 562 200 L 596 200" fill="none" stroke="#012169" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#w09-dagger-arrow)"/>
<rect x="606" y="140" width="244" height="120" rx="8" fill="#FFFFFF" stroke="#012169" stroke-width="2"/>
<text x="728.0" y="197.0" font-family="Arial, sans-serif" font-size="36" font-weight="600" text-anchor="middle" fill="#012169">Add pairs</text>
<text x="728.0" y="235.0" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="middle" fill="#56606E">Merge data</text>
<path d="M 850 200 L 884 200" fill="none" stroke="#012169" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#w09-dagger-arrow)"/>
<rect x="894" y="140" width="244" height="120" rx="8" fill="#FFFFFF" stroke="#012169" stroke-width="2"/>
<text x="1016.0" y="197.0" font-family="Arial, sans-serif" font-size="36" font-weight="600" text-anchor="middle" fill="#012169">Retrain</text>
<text x="1016.0" y="235.0" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="middle" fill="#56606E">Update policy</text>
<path d="M 1016 260 L 1016 336 L 152 336 L 152 270" fill="none" stroke="#012169" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#w09-dagger-arrow)"/>
<rect x="287.4" y="316" width="593.2" height="46" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
<text x="584" y="350" font-family="Arial, sans-serif" font-size="34" font-weight="400" text-anchor="middle" fill="#111111">Repeat with the updated policy</text>
<text x="584" y="410" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="middle" fill="#56606E">Visited states can be unfamiliar</text>
</svg>
