<svg id="w09-multiple-valid-paths" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1168 430" role="img" aria-labelledby="w09-multiple-valid-paths-title w09-multiple-valid-paths-desc"><title id="w09-multiple-valid-paths-title">An average path can collide</title><desc id="w09-multiple-valid-paths-desc">Two illustrative paths avoid an obstacle above and below. Their pointwise average goes through the obstacle. This illustrates a failure of simple squared-error mean prediction, not all imitation policies.</desc>
