<path d="M 174 216 L 994 216" fill="none" stroke="#B9975B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 9" marker-end="url(#w09-multiple-valid-paths-gold-arrow)"/>
<circle cx="150" cy="216" r="24" fill="#FFFFFF" stroke="#012169" stroke-width="4"/>
