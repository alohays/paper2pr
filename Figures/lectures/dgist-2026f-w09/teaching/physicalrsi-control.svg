<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1168 430" role="img" aria-labelledby="design-physicalrsi-control-title design-physicalrsi-control-desc"><title id="design-physicalrsi-control-title">PhysicalRSI separates planning from skill execution</title><desc id="design-physicalrsi-control-desc">Observation and task enter System 2. It plans and revises skills. A separate System 1 executes skills or control code. Execution results return as feedback for the next plan. Skills may include a VLA. The exact high-level model backend is not identified here.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs><rect width="1168" height="430" fill="white"/><text x="155" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="600" fill="#012169">Inputs</text><text x="155" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#012169">Observation</text><text x="155" y="199" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#012169">+ task</text><rect x="396" y="92" width="353" height="163" rx="12" fill="#F3EBDC" stroke="#B9975B" stroke-width="2.5"/><text x="572" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="600" fill="#012169">System 2</text><text x="572" y="211" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#012169">Plan + revise</text><text x="981" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="600" fill="#012169">System 1</text><text x="981" y="211" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#012169">Skills or code</text><path d="M288 174 H383" fill="none" stroke="#012169" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M749 174 H822" fill="none" stroke="#012169" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M310 174 V45 H982 V112" fill="none" stroke="#012169" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="590" y="33" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#012169">Current observation</text><path d="M786 183 V260" fill="none" stroke="#D7DCE3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="786" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#56606E">Subgoals / skill updates</text><path d="M1050 244 V371 H155 V231" fill="none" stroke="#012169" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="341" y="344" width="496" height="56" rx="0" fill="white" stroke="white" stroke-width="2.5"/><text x="589" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#012169">Observe execution results</text></svg>
