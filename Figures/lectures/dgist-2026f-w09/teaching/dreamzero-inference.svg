<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1168 430" role="img" aria-labelledby="design-dreamzero-inference-title design-dreamzero-inference-desc"><title id="design-dreamzero-inference-title">DreamZero generates future video and actions jointly</title><desc id="design-dreamzero-inference-desc">Observation, robot state and instruction condition joint generation. Predicted video is a computational output. Actions go to the physical robot, whose next real observation returns as input. The coffee image is only a teaching symbol; it does not claim a demonstrated DreamZero coffee capability.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs><rect width="1168" height="430" fill="white"/><text x="163" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#012169">Observation</text><text x="163" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#012169">Robot state</text><text x="163" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#012169">Instruction</text><rect x="375" y="122" width="321" height="129" rx="12" fill="#F3EBDC" stroke="#B9975B" stroke-width="2.5"/><text x="535" y="197" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="600" fill="#012169">DreamZero</text><text x="535" y="77" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#012169">Generated together</text><path d="M289 185 H362" fill="none" stroke="#012169" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="942" y="39" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="600" fill="#012169">Predicted video</text><rect x="786" y="52" width="337" height="124" rx="1