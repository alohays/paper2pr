<svg xmlns="http://www.w3.org/2000/svg" id="w06-wm-kick-prediction-1" viewBox="0 0 1200 530" role="img" aria-labelledby="w06-wm-kick-prediction-1-title w06-wm-kick-prediction-1-desc"><title id="w06-wm-kick-prediction-1-title">A kick provides clues about the following ball trajectory</title><desc id="w06-wm-kick-prediction-1-desc">Own schematic of a curved ball trajectory, not measured footage or a deterministic physics calculation. The point is prediction from observed action and outcome.</desc><style>#w06-wm-kick-prediction-1 text{font-family:"Source Sans Pro","Pretendard",Arial,sans-serif} #w06-wm-kick-prediction-1 *{vector-effect:non-scaling-stroke}</style><rect width="1200" height="530" fill="white"/><text x="215" y="76" font-size="43" fill="#012169" font-weight="600" text-anchor="middle">The kick</text><text x="850" y="76" font-size="43" fill="#356FC4" font-weight="600" text-anchor="middle">The ball’s path</text><g transform="translate(195 313) scale(1.1)" stroke="#012169" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-75" r="18" fill="white"/><path d="M-4 -52L-15 14L-52 63M-15 14L25 36L68 14M-8 -34L-49 -11M-8 -34L39 -54"/></g><circle cx="313" cy="327" r="18" fill="white" stroke="#012169" stroke-width="3"/><path d="M308 321L318 321L321 330L313 335L305 330Z" fill="#012169"/><path d="M85 410L1110 410M954 135V362M954 135H1100V362M1100 135L1130 178V410" fill="none" stroke="#D6DCE4" stroke-width="3"/><path d="M342 305C494 148 642 124 763 170S947 261 1034 234" fill="none" stroke="#356FC4" stroke-width="6" stroke-linecap="round"/><circle cx="1034" cy="234" r="18" fill="white" stroke="#356FC4" stroke-width="3"/><path d="M1029 228L1039 228L1042 237L1034 242L1026 237Z" fill="#356FC4"/><text x="600" y="487" font-size="38" fill="#287B83" font-weight="400" text-anchor="middle">Watch the action. Learn to anticipate the change.</text></svg>
