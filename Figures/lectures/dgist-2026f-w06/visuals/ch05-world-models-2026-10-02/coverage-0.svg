<svg xmlns="http://www.w3.org/2000/svg" id="w06-wm-coverage-0" viewBox="0 0 1200 530" role="img" aria-labelledby="w06-wm-coverage-0-title w06-wm-coverage-0-desc"><title id="w06-wm-coverage-0-title">First-person collection selects only part of human visual experience</title><desc id="w06-wm-coverage-0-desc">Schematic selection biases; no claim that all collections are laboratory-only or any quantitative proportion of online video.</desc><style>#w06-wm-coverage-0 text{font-family:"Source Sans Pro","Pretendard",Arial,sans-serif} #w06-wm-coverage-0 *{vector-effect:non-scaling-stroke}</style><rect width="1200" height="530" fill="white"/><text x="600" y="55" font-size="47" fill="#012169" font-weight="600" text-anchor="middle">Purpose-built capture</text><text x="220" y="120" font-size="42" fill="#657181" font-weight="400" text-anchor="middle">Viewpoint</text><text x="600" y="120" font-size="42" fill="#657181" font-weight="400" text-anchor="middle">Task</text><text x="980" y="120" font-size="42" fill="#657181" font-weight="400" text-anchor="middle">Setup</text><g transform="translate(220 226) scale(1.45)"><path d="M-45 0Q0 -38 45 0Q0 38 -45 0Z" fill="white" stroke="#356FC4" stroke-width="4"/><circle r="13" fill="#356FC4"/></g><g xmlns="http://www.w3.org/2000/svg" transform="translate(458 138) scale(0.46)" data-objects="cup drawer"><path d="M 26 101 L 338 101 L 389 137 L 69 137 Z" stroke="#012169" stroke-width="3" fill="#F4F6FA" stroke-linecap="round" stroke-linejoin="round" /><path d="M 69 137 L 389 137 L 389 288 L 69 288 Z" stroke="#012169" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round" /><path d="M 26 101 L 69 137 L 69 288 L 26 251 Z" stroke="#012169" stroke-width="3" fill="#E8EDF5" stroke-linecap="round" stroke-linejoin="round" /><rect x="91" y="158" width="271" height="102" rx="3" fill="white" stroke="#012169" stroke-width="3" /><rect x="184" y="197" width="84" height="12" rx="5" fill="#E8EDF5" stroke="#012169" stroke-width="3" /><g transform="translate(301 55) scale(0.67)"><path d="M 0 0 L 8 74 Q 40 88 72 74 L 80 0 Z" stroke="#012169" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round" /><path d="M 80 14 C 116 8 119 63 78 61" stroke="#012169" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M 0 0 Q 40 -9 80 0" stroke="#012169" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g></g><g stroke="#012169" stroke-width="4" fill="none"><rect x="916" y="181" width="120" height="88" rx="8"/><circle cx="976" cy="225" r="27"/><path d="M928 180L940 166H986L997 180"/></g><path d="M80 315L1120 315" stroke="#D6DCE4" stroke-width="2" fill="none"/><text x="600" y="393" font-size="43" fill="#012169" font-weight="400" text-anchor="middle">Many hours can repeat a chosen setup.</text><text x="600" y="476" font-size="40" fill="#657181" font-weight="400" text-anchor="middle">Daily life is broader than the collection plan.</text></svg>
