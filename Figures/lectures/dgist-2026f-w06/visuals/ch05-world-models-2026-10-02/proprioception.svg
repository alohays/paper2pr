<svg xmlns="http://www.w3.org/2000/svg" id="w06-wm-proprioception" viewBox="0 0 1200 530" role="img" aria-labelledby="w06-wm-proprioception-title w06-wm-proprioception-desc"><title id="w06-wm-proprioception-title">Proprioception: body position sense without looking</title><desc id="w06-wm-proprioception-desc">Own illustrative nose-touch gesture for a classroom exercise, not a clinical assessment. Spoken explanation distinguishes it from egocentric RGB video.</desc><style>#w06-wm-proprioception text{font-family:"Source Sans Pro","Pretendard",Arial,sans-serif} #w06-wm-proprioception *{vector-effect:non-scaling-stroke}</style><rect width="1200" height="530" fill="white"/><g transform="translate(285 245)" stroke="#012169" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M-52 -60C-68 -130 53 -142 71 -75L87 -45L70 -39Q76 18 18 21L10 61"/><path d="M-52 -62L-48 -1L-83 56Q-149 65 -160 137M10 61Q51 82 56 149"/><path d="M-8 -63Q7 -52 24 -63"/><path d="M-58 131L40 100L76 -33L105 -34" stroke="#287B83" stroke-width="12"/><circle cx="88" cy="-34" r="7" fill="#94712E" stroke="white"/></g><text x="830" y="160" font-size="56" fill="#012169" font-weight="600" text-anchor="middle">Proprioception</text><text x="830" y="236" font-size="42" fill="#287B83" font-weight="400" text-anchor="middle">Where is my body?</text><text x="830" y="345" font-size="42" fill="#012169" font-weight="400" text-anchor="middle">Eyes closed.</text><text x="830" y="406" font-size="42" fill="#012169" font-weight="400" text-anchor="middle">Touch your nose.</text><text x="600" y="504" font-size="39" fill="#657181" font-weight="400" text-anchor="middle">A body sense, beyond what the camera sees.</text></svg>
