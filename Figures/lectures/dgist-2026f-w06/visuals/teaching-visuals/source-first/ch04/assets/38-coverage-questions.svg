<svg xmlns="http://www.w3.org/2000/svg" id="sourcefirst-38" viewBox="0 0 1200 520" role="img" aria-labelledby="sourcefirst-38-title sourcefirst-38-desc"><title id="sourcefirst-38-title">Two questions to ask after viewing actual dataset samples</title><desc id="sourcefirst-38-desc">Paired with the original EgoVerse coverage figure; equal emphasis on activity selection and camera viewpoint.</desc><style>#sourcefirst-38 text{font-family:Arial,Pretendard,sans-serif} #sourcefirst-38 *{vector-effect:non-scaling-stroke}</style><rect width="1200" height="520" fill="white"/><text x="600" y="117" font-size="58" fill="#012169" text-anchor="middle" font-weight="600">Which experiences fill these hours?</text><text x="294" y="262" font-size="54" fill="#8B6A31" text-anchor="middle" font-weight="600">Activities</text><text x="900" y="262" font-size="54" fill="#8B6A31" text-anchor="middle" font-weight="600">Viewpoints</text><text x="294" y="365" font-size="44" fill="#012169" text-anchor="middle" font-weight="400">What was filmed?</text><text x="900" y="365" font-size="44" fill="#012169" text-anchor="middle" font-weight="400">Where was the camera?</text></svg>