<svg xmlns="http://www.w3.org/2000/svg" id="sourcefirst-37" viewBox="0 0 1200 520" role="img" aria-labelledby="sourcefirst-37-title sourcefirst-37-desc"><title id="sourcefirst-37-title">1000collectors for8productive hours each per day produce100000hours in12.5ideal days</title><desc id="sourcefirst-37-desc">Illustrative arithmetic, not the staffing or collection time of a named dataset. Excludes setup, quality checks, processing and losses.</desc><style>#sourcefirst-37 text{font-family:Arial,Pretendard,sans-serif} #sourcefirst-37 *{vector-effect:non-scaling-stroke}</style><rect width="1200" height="520" fill="white"/><text x="600" y="70" font-size="44" fill="#586B83" text-anchor="middle" font-weight="400">Hypothetical collection example</text><text x="210" y="190" font-size="82" fill="#012169" text-anchor="middle" font-weight="600">1,000</text><text x="210" y="254" font-size="44" fill="#012169" text-anchor="middle" font-weight="400">people</text><text x="420" y="198" font-size="62" fill="#586B83" text-anchor="middle" font-weight="400">×</text><text x="610" y="190" font-size="82" fill="#012169" text-anchor="middle" font-weight="600">8 h</text><text x="610" y="254" font-size="40" fill="#012169" text-anchor="middle" font-weight="400">per person / day</text><text x="810" y="198" font-size="62" fill="#586B83" text-anchor="middle" font-weight="400">=</text><text x="1010" y="190" font-size="72" fill="#8B6A31" text-anchor="middle" font-weight="600">8,000 h</text><text x="1010" y="254" font-size="40" fill="#586B83" text-anchor="middle" font-weight="400">per day</text><path d="M80 299 H1120" stroke="#B7C3D2" stroke-width="2"/><text x="600" y="375" font-size="50" fill="#012169" text-anchor="middle" font-weight="400">100,000 h ÷ 8,000 h/day</text><text x="600" y="477" font-size="76" fill="#8B6A31" text-anchor="middle" font-weight="600">12.5 ideal days</text></svg>