<title id="w06-p27-teleop-cost-title">Teleoperation requires a robot and control equipment during collection</title><desc id="w06-p27-teleop-cost-desc">Own hardware schematic. Recording a teleoperated demonstration occupies a robot and needs operator hardware and setup. Scene reset and recording checks add further work. No specific monetary price is claimed.</desc>
