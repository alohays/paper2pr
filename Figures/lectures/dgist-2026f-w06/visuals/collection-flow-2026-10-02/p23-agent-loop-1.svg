<svg xmlns="http://www.w3.org/2000/svg" id="w06-p23-agent-loop-1" viewBox="0 0 1200 540" role="img" aria-labelledby="w06-p23-agent-loop-1-title w06-p23-agent-loop-1-desc">
<title id="w06-p23-agent-loop-1-title">An agent observes, acts, and changes its environment</title><desc id="w06-p23-agent-loop-1-desc">Own teaching reconstruction of the agent-environment framework. Observation returns from environment to agent. Actions change the drawer and cup. In the final state reward is an illustrative numerical goal score, not a claim about robot feelings or a required demonstration label.</desc>
<style>#w06-p23-agent-loop-1 text{font-family:"Source Sans Pro","Pretendard",Arial,sans-serif} #w06-p23-agent-loop-1 *{vector-effect:non-scaling-stroke}</style>
