ht="27" rx="5" fill="white" stroke="#8B6A31" stroke-width="3" /><path d="M -25 9 L -20 35 L -20 75 L -10 75 M 25 9 L 20 35 L 20 75 L 10 75" fill="none" stroke="#8B6A31" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" /></g></g><text class="" x="522" y="246" font-size="40" fill="#657181" font-weight="400" text-anchor="middle">State:</text><text class="" x="522" y="291" font-size="40" fill="#657181" font-weight="400" text-anchor="middle">gripper</text><text class="" x="522" y="336" font-size="40" fill="#657181" font-weight="400" text-anchor="middle">closed</text><text class="" x="274" y="391" font-size="40" fill="#356FC4" font-weight="400" text-anchor="middle">Camera frame</text><line x1="698" y1="258" x2="829" y2="258" stroke="#287B83" stroke-width="4"/><path d="M 815 249 L 829 258 L 815 267" fill="none" stroke="#287B83" stroke-width="4"/><text class="" x="998" y="182" font-size="44" fill="#287B83" font-weight="600" text-anchor="middle">Action to learn</text><text class="" x="998" y="278" font-size="76" fill="#287B83" font-weight="600" text-anchor="middle">Pull</text><text class="" x="998" y="344" font-size="40" fill="#657181" font-weight="400" text-anchor="middle">Human command</text><text class="" x="600" y="510" font-size="42" fill="#012169" font-weight="400" text-anchor="middle">Train a policy: observation → demonstrated action</text></svg>
