<svg xmlns="http://www.w3.org/2000/svg" id="w06-p26-training-pair" viewBox="0 0 1200 540" role="img" aria-labelledby="w06-p26-training-pair-title w06-p26-training-pair-desc">
<title id="w06-p26-training-pair-title">One aligned record becomes an observation-action training pair</title><desc id="w06-p26-training-pair-desc">Current camera frame and measured robot state form the observation. The demonstrator command at that time is the supervised action target. The next robot state is not substituted as the current observation.</desc>
<style>#w06-p26-training-pair text{font-family:"Source Sans Pro","Pretendard",Arial,sans-serif} #w06-p26-training-pair *{vector-effect:non-scaling-stroke}</style>
