<svg xmlns="http://www.w3.org/2000/svg" id="w06-p26-aligned-streams" viewBox="0 0 1200 540" role="img" aria-labelledby="w06-p26-aligned-streams-title w06-p26-aligned-streams-desc">
<title id="w06-p26-aligned-streams-title">Camera, demonstrated commands, and robot state aligned in time</title><desc id="w06-p26-aligned-streams-desc">Illustrative synchronized recording. Camera observations and current measured robot state align with each human-issued command. Later measured states may show the effect of an earlier command. Commands and achieved motion are distinct.</desc>
<style>#w06-p26-aligned-streams text{font-family:"Source Sans Pro","Pretendard",Arial,sans-serif} #w06-p26-aligned-streams *{vector-effect:non-scaling-stroke}</style>
