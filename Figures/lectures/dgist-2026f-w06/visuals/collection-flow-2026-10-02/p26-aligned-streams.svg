<title id="w06-p26-aligned-streams-title">Camera and measured robot state, paired with human action</title><desc id="w06-p26-aligned-streams-desc">At each timestamp, camera and current measured robot state form the observation. The human command at that same timestamp is stored as the action target; changed state is recorded at a later moment.</desc>
