<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" id="w06-p13-design-choice" role="img" aria-labelledby="w06-p13-design-choice-title w06-p13-design-choice-desc">
<title id="w06-p13-design-choice-title">Two ways to organize the same translation task</title>
<desc id="w06-p13-design-choice-desc">Instructor-authored simplified design example based on Chung's reading and writing discussion. The blue design has separate reading and writing parts. The teal design shares one model for both. Both learn from data. These examples explain predefined roles; the following curves are conceptual, not measured comparisons of these architectures.</desc>
<style>#w06-p13-design-choice text{font-family:"Source Sans Pro","Pretendard",Arial,sans-serif} #w06-p13-design-choice *{vector-effect:non-scaling-stroke}</style>
<rect width="1200" height="530" fill="#ffffff"/>
<text x="600" y="50" font-size="46" fill="#012169" text-anchor="middle" font-weight="400">One design choice: split or share roles</text><text x="90" y="125" font-size="44" fill="#3D78DA" text-anchor="start" font-weight="600">Separate roles</text><text x="115" y="230" font-size="42" fill="#657181" text-anchor="middle" font-weight="400">English</text><line x1="213" y1="215" x2="284" y2="215" stroke="#3D78DA" stroke-width="3"/><path d="M 272 207 L 284 215 L 272 223" fill="none" stroke="#3D78DA" stroke-width="3"/><rect x="304" y="172" width="215" height="88" rx="5" fill="none" stroke="#3D78DA" stroke-width="3"/><text x="411.5" y="230" font-size="48" fill="#3D78DA" text-anchor="middle" font-weight="600">Read</text><line x1="535" y1="215" x2="572" y2="215" stroke="#3D78DA" stroke-width="3"/><path d="M 560 207 L 572 215 L 560 223" fill="none" stroke="#3D78DA" stroke-width="3"/><rect x="592" y="172" width="215" height="88" rx="5" fill="none" stroke="#3D78DA" stroke-width="3"/><text x="699.5" y="230" font-size="48" fill="#3D78DA" text-anchor="middle" font-weight="600">Write</text><line x1="825" y1="215" x2="923" y2="215" stroke="#3D78DA" stroke-width="3"/><path d="M 911 207 L 923 215 L 911 223" fill="none" stroke="#3D78DA" stroke-width="3"/><text x="1044" y="230" font-size="42" fill="#657181" text-anchor="middle" font-weight="400">German</text><text x="90" y="322" font-size="44" fill="#60949F" text-anchor="start" font-weight="600">Shared model</text><text x="115" y="421" font-size="42" fill="#657181" text-anchor="middle" font-weight="400">English</text><line x1="213" y1="406" x2="348" y2="406" stroke="#60949F" stroke-width="3"/><path d="M 336 398 L 348 406 L 336 414" fill="none" stroke="#60949F" stroke-width="3"/><rect x="372" y="363" width="460" height="88" rx="5" fill="none" stroke="#60949F" stroke-width="3"/><text x="602" y="421" font-size="48" fill="#60949F" text-anchor="middle" font-weight="600">Read + write</text><line x1="850" y1="406" x2="923" y2="406" stroke="#60949F" stroke-width="3"/><path d="M 911 398 L 923 406 L 911 414" fill="none" stroke="#60949F" stroke-width="3"/><text x="1044" y="421" font-size="42" fill="#657181" text-anchor="middle" font-weight="400">German</text><text x="600" y="510" font-size="40" fill="#012169" text-anchor="middle" font-weight="400">Both models learn from data.</text>
</svg>
