<svg xmlns="http://www.w3.org/2000/svg" id="w06-p17-multimodal-2" viewBox="0 0 1200 520" role="img" aria-labelledby="w06-p17-multimodal-2-title w06-p17-multimodal-2-desc" data-stage="2">
<title id="w06-p17-multimodal-2-title">Adding vision to a text-based LLM, stage 3</title>
<desc id="w06-p17-multimodal-2-desc">Instructor-authored teaching schematic. Text, vision and audio are examples of information modalities. This LLM-based example takes text and an image, and outputs text. The image contains only a cup and a drawer. The example is an MLLM and a vision-language model; the names are not asserted to be universally equivalent. Audio is a modality example, not an input to the displayed model.</desc>
<style>#w06-p17-multimodal-2 text{font-family:"Source Sans Pro","Pretendard",Arial,sans-serif} #w06-p17-multimodal-2 *{vector-effect:non-scaling-stroke}</style>
<rect width="1200" height="520" fill="white"/>
