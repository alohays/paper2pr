142" rx="8" fill="#E8EDF5" stroke="#012169" stroke-width="3"/><line x1="783" y1="251" x2="879" y2="251" stroke="#012169" stroke-width="4"/><path d="M 866 242 L 879 251 L 866 260" fill="none" stroke="#012169" stroke-width="4"/><text class="" x="622" y="240" font-size="60" fill="#012169" text-anchor="middle" font-weight="600">MLLM</text><text class="" x="622" y="295" font-size="40" fill="#012169" text-anchor="middle" font-weight="400">LLM + vision</text><text class="" x="1015" y="232" font-size="48" fill="#012169" text-anchor="middle" font-weight="600">A cup and</text><text class="" x="1015" y="289" font-size="48" fill="#012169" text-anchor="middle" font-weight="600">a drawer.</text><text class="" x="1015" y="364" font-size="40" fill="#657181" text-anchor="middle" font-weight="400">Text output</text><text class="term-mllm" x="600" y="430" font-size="44" fill="#012169" text-anchor="middle" font-weight="600">MLLM: Multimodal Large Language Model</text><text class="term-vlm" x="600" y="491" font-size="44" fill="#012169" text-anchor="middle" font-weight="400">VLM: Vision-Language Model (text + vision)</text>
</svg>
