<svg xmlns="http://www.w3.org/2000/svg" id="w06-p17-multimodal-0" viewBox="0 0 1200 520" role="img" aria-labelledby="w06-p17-multimodal-0-title w06-p17-multimodal-0-desc" data-stage="0">
<title id="w06-p17-multimodal-0-title">Adding vision to a text-based LLM, stage 1</title>
<desc id="w06-p17-multimodal-0-desc">Instructor-authored teaching schematic. Text, vision and audio are examples of information modalities. This LLM-based example takes text and an image, and outputs text. The image contains only a cup and a drawer. The example is an MLLM and a vision-language model; the names are not asserted to be universally equivalent. Audio is a modality example, not an input to the displayed model.</desc>
<style>#w06-p17-multimodal-0 text{font-family:"Source Sans Pro","Pretendard",Arial,sans-serif} #w06-p17-multimodal-0 *{vector-effect:non-scaling-stroke}</style>
<rect width="1200" height="520" fill="white"/>
<text class="" x="600" y="62" font-size="48" fill="#012169" text-anchor="middle" font-weight="600">Modality = a type of information</text><text class="" x="215" y="271" font-size="58" fill="#012169" text-anchor="middle" font-weight="400">Text</text><line x1="343" y1="250" x2="462" y2="250" stroke="#012169" stroke-width="4"/><path d="M 449 241 L 462 250 L 449 259" fill="none" stroke="#012169" stroke-width="4"/><rect x="482" y="181" width="280" height="142" rx="8" fill="#E8EDF5" stroke="#012169" stroke-width="3"/><text class="" x="622" y="273" font-size="64" fill="#012169" text-anchor="middle" font-weight="600">LLM</text><line x1="783" y1="250" x2="879" y2="250" stroke="#012169" stroke-width="4"/><path d="M 866 241 L 879 250 L 866 259" fill="none" stroke="#012169" stroke-width="4"/><text class="" x="1015" y="271" font-size="58" fill="#012169" text-anchor="middle" font-weight="400">Text</text><text class="" x="600" y="426" font-size="48" fill="#012169" text-anchor="middle" font-weight="400">Examples: Text · Vision · Audio</text><text class="" x="600" y="491" font-size="42" fill="#657181" text-anchor="middle" font-weight="400">Start with one input modality: text.</text>
</svg>
