<svg xmlns="http://www.w3.org/2000/svg" id="w14-buy" viewBox="0 0 1168 360" role="img" aria-labelledby="w14-buy-title w14-buy-desc"><title id="w14-buy-title">What money already buys, and what comes next</title><desc id="w14-buy-desc">Three columns. Body: 1.5 million dispensing checks for the obesity drug Mounjaro in ten months. Height: growth-hormone prescriptions rose from 55 thousand to 248 thousand a year. Next: knowing, that is knowledge and intelligence.</desc><style>#w14-buy text{font-family:inherit}</style><defs><marker id="w14-buy-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#173f58" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="w14-buy-w" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#af5526" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="w14-buy-m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8fa3b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g ><text x="195" y="40" text-anchor="middle" font-size="34" font-weight="600" fill="#56677a" >Body</text><circle cx="195" cy="93.0" r="21.0" fill="#eaf0f2" stroke="#173f58" stroke-width="3"/><path d="M159.0 172.0 V150.0 Q159.0 124.0 195 124.0 Q231.0 124.0 231.0 150.0 V172.0 Z" fill="#eaf0f2" stroke="#173f58" stroke-width="3" stroke-linejoin="round"/><text x="195" y="256" text-anchor="middle" font-size="60" font-weight="700" fill="#183451" >1.5 million</text><text x="195" y="304" text-anchor="middle" font-size="30" font-weight="400" fill="#1f2a36" >Mounjaro checks</text><text x="195" y="342" text-anchor="middle" font-size="30" font-weight="400" fill="#1f2a36" >in its first 10 months</text></g><g class="fragment" ><path d="M389 24 V352" fill="none" stroke="#b5c6cd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="584" y="40" text-anchor="middle" font-size="34" font-weight="600" fill="#56677a" >Height</text><circle cx="570" cy="93.0" r="21.0" fill="#eaf0f2" stroke="#173f58" stroke-width="3"/><path d="M534.0 172.0 V150.0 Q534.0 124.0 570 124.0 Q606.0 124.0 606.0 150.0 V172.0 Z" fill="#eaf0f2" stroke="#173f58" stroke-width="3" stroke-linejoin="round"/><path d="M636 170 V78" fill="none" stroke="#173f58" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#w14-buy-a)"/><text x="584" y="256" text-anchor="middle" font-size="60" font-weight="700" fill="#183451" >55k → 248k</text><text x="584" y="304" text-anchor="middle" font-size="30" font-weight="400" fill="#1f2a36" >growth-hormone</text><text x="584" y="342" text-anchor="middle" font-size="30" font-weight="400" fill="#1f2a36" >prescriptions a year</text></g><g class="fragment" ><path d="M779 24 V352" fill="none" stroke="#b5c6cd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="973" y="40" text-anchor="middle" font-size="34" font-weight="600" fill="#9c4a1e" >Next</text><circle cx="973" cy="102.9" r="18.900000000000002" fill="#fbeadb" stroke="#af5526" stroke-width="3"/><path d="M940.6 174.0 V154.20000000000002 Q940.6 130.8 973 130.8 Q1005.4 130.8 1005.4 154.20000000000002 V174.0 Z" fill="#fbeadb" stroke="#af5526" stroke-width="3" stroke-linejoin="round"/><path d="M933 96 l-14 -10 M973 74 v-14 M1013 96 l14 -10" fill="none" stroke="#af5526" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="973" y="256" text-anchor="middle" font-size="60" font-weight="700" fill="#9c4a1e" >Knowing</text><text x="973" y="304" text-anchor="middle" font-size="30" font-weight="400" fill="#1f2a36" >knowledge and</text><text x="973" y="342" text-anchor="middle" font-size="30" font-weight="400" fill="#1f2a36" >intelligence</text></g></svg>
