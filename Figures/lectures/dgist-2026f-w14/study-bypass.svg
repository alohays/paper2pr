<svg xmlns="http://www.w3.org/2000/svg" id="w14-bypass" viewBox="0 0 1168 350" role="img" aria-labelledby="w14-bypass-title w14-bypass-desc"><title id="w14-bypass-title">A shortcut around years of study</title><desc id="w14-bypass-desc">The usual path runs from years of study to knowledge to a top score. A second path runs from AI plus a small device straight to the top score, skipping both.</desc><style>#w14-bypass text{font-family:inherit}</style><defs><marker id="w14-bypass-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#173f58" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="w14-bypass-w" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#af5526" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="w14-bypass-m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8fa3b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="40" y="60" width="300" height="92" rx="12" fill="#eaf0f2" stroke="#173f58" stroke-width="3" /><text x="190" y="118" text-anchor="middle" font-size="38" font-weight="700" fill="#183451" >Years of study</text><path d="M352 106 H432" fill="none" stroke="#173f58" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#w14-bypass-a)"/><rect x="444" y="60" width="280" height="92" rx="12" fill="#eaf0f2" stroke="#173f58" stroke-width="3" /><text x="584" y="118" text-anchor="middle" font-size="38" font-weight="700" fill="#183451" >Knowledge</text><path d="M736 106 H816" fill="none" stroke="#173f58" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#w14-bypass-a)"/><rect x="828" y="60" width="300" height="92" rx="12" fill="#eaf0f2" stroke="#173f58" stroke-width="3" /><text x="978" y="118" text-anchor="middle" font-size="38" font-weight="700" fill="#183451" >Top score</text><g class="fragment" ><rect x="300" y="236" width="420" height="92" rx="12" fill="#fbeadb" stroke="#af5526" stroke-width="3" /><text x="510" y="294" text-anchor="middle" font-size="38" font-weight="700" fill="#9c4a1e" >AI + a small device</text><path d="M732 282 Q960 282 974 166" fill="none" stroke="#af5526" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#w14-bypass-w)"/></g></svg>
