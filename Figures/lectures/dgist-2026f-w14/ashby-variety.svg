<svg xmlns="http://www.w3.org/2000/svg" id="w14-ashby" viewBox="0 0 1168 326" role="img" aria-labelledby="w14-ashby-title w14-ashby-desc"><title id="w14-ashby-title">Two ways to match variety</title><desc id="w14-ashby-desc">Way one shrinks the variety of the AI down to the regulator. Way two grows the variety of the regulator up to the AI.</desc><style>#w14-ashby text{font-family:inherit}</style><defs><marker id="w14-ashby-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#173f58" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="w14-ashby-w" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#af5526" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="w14-ashby-m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8fa3b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g ><text x="292" y="40" text-anchor="middle" font-size="38" font-weight="700" fill="#183451" >Way one: shrink the AI</text><path d="M120 268 H464" fill="none" stroke="#8fa3b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="170" y="196" width="96" height="72" rx="4" fill="#fbeadb" stroke="#af5526" stroke-width="3" /><rect x="318" y="72" width="96" height="196" rx="4" fill="none" stroke="#173f58" stroke-width="3" stroke-dasharray="9 7"/><rect x="318" y="196" width="96" height="72" rx="4" fill="#5f7f99" stroke="#173f58" stroke-width="3" /><path d="M366 86 V180" fill="none" stroke="#173f58" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#w14-ashby-a)"/><text x="218" y="310" text-anchor="middle" font-size="32" font-weight="600" fill="#9c4a1e" >Regulator</text><text x="366" y="310" text-anchor="middle" font-size="32" font-weight="600" fill="#183451" >AI</text></g><g class="fragment" ><path d="M584 14 V312" fill="none" stroke="#b5c6cd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="876" y="40" text-anchor="middle" font-size="38" font-weight="700" fill="#183451" >Way two: grow the regulator</text><path d="M704 268 H1048" fill="none" stroke="#8fa3b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="754" y="72" width="96" height="196" rx="4" fill="none" stroke="#af5526" stroke-width="3" stroke-dasharray="9 7"/><rect x="754" y="196" width="96" height="72" rx="4" fill="#fbeadb" stroke="#af5526" stroke-width="3" /><path d="M802 180 V86" fill="none" stroke="#af5526" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#w14-ashby-w)"/><rect x="902" y="72" width="96" height="196" rx="4" fill="#5f7f99" stroke="#173f58" stroke-width="3" /><text x="802" y="310" text-anchor="middle" font-size="32" font-weight="600" fill="#9c4a1e" >Regulator</text><text x="950" y="310" text-anchor="middle" font-size="32" font-weight="600" fill="#183451" >AI</text></g></svg>
