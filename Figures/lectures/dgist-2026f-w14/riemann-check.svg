<svg xmlns="http://www.w3.org/2000/svg" id="w14-check" viewBox="0 0 1168 350" role="img" aria-labelledby="w14-check-title w14-check-desc"><title id="w14-check-title">The machine has checked the proof; no human has explained it yet</title><desc id="w14-check-desc">The proof, 17 million lines, goes two ways. The machine check is done and certified. The human reader has not yet followed it.</desc><style>#w14-check text{font-family:inherit}</style><defs><marker id="w14-check-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#173f58" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="w14-check-w" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#af5526" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="w14-check-m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8fa3b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="40" y="116" width="300" height="128" rx="12" fill="#eaf0f2" stroke="#173f58" stroke-width="3" /><text x="190" y="170" text-anchor="middle" font-size="40" font-weight="700" fill="#183451" >The proof</text><text x="190" y="216" text-anchor="middle" font-size="30" font-weight="400" fill="#1f2a36" >17 million lines</text><path d="M352 160 Q430 100 508 86" fill="none" stroke="#173f58" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#w14-check-a)"/><rect x="520" y="40" width="300" height="92" rx="12" fill="#fff" stroke="#173f58" stroke-width="3" /><text x="670" y="98" text-anchor="middle" font-size="38" font-weight="700" fill="#183451" >Machine check</text><path d="M858 86 l16 18 l30 -38" fill="none" stroke="#173f58" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><text x="924" y="100" text-anchor="start" font-size="40" font-weight="700" fill="#183451" >certified</text><g class="fragment" ><path d="M352 200 Q430 262 508 276" fill="none" stroke="#af5526" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#w14-check-w)"/><rect x="520" y="230" width="300" height="92" rx="12" fill="#fbeadb" stroke="#af5526" stroke-width="3" /><text x="670" y="288" text-anchor="middle" font-size="38" font-weight="700" fill="#9c4a1e" >Human reader</text><text x="858" y="290" text-anchor="start" font-size="40" font-weight="700" fill="#9c4a1e" >not yet</text></g></svg>
