<svg xmlns="http://www.w3.org/2000/svg" id="w14-four" viewBox="0 0 1168 322" role="img" aria-labelledby="w14-four-title w14-four-desc"><title id="w14-four-title">Chalmers&#x27; four outcomes for humans</title><desc id="w14-four-desc">Four pictures of a person and an AI. Extinction: the person is gone. Isolation: a wall between them. Inferiority: a small person beside a large AI. Integration: the person and the AI joined.</desc><style>#w14-four text{font-family:inherit}</style><defs><marker id="w14-four-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#173f58" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="w14-four-w" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#af5526" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="w14-four-m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8fa3b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g ><circle cx="100" cy="85.32" r="19.32" fill="#fff" stroke="#a9b6c2" stroke-width="3" stroke-dasharray="6 6"/><path d="M66.88 158.0 V137.76 Q66.88 113.84 100 113.84 Q133.12 113.84 133.12 137.76 V158.0 Z" fill="#fff" stroke="#a9b6c2" stroke-width="3" stroke-linejoin="round" stroke-dasharray="6 6"/><rect x="152.0" y="78.0" width="80.0" height="80.0" rx="14.0" fill="#eaf0f2" stroke="#173f58" stroke-width="3" /><text x="192" y="129.0" text-anchor="middle" font-size="32" font-weight="700" fill="#183451" >AI</text><text x="146" y="250" text-anchor="middle" font-size="42" font-weight="700" fill="#183451" >Extinction</text><text x="146" y="296" text-anchor="middle" font-size="32" font-weight="400" fill="#1f2a36" >we disappear</text></g><g class="fragment" ><path d="M292 20 V310" fill="none" stroke="#b5c6cd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="376" cy="85.32" r="19.32" fill="#eaf0f2" stroke="#173f58" stroke-width="3"/><path d="M342.88 158.0 V137.76 Q342.88 113.84 376 113.84 Q409.12 113.84 409.12 137.76 V158.0 Z" fill="#eaf0f2" stroke="#173f58" stroke-width="3" stroke-linejoin="round"/><path d="M438 50 V180" fill="none" stroke="#173f58" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><rect x="460.0" y="78.0" width="80.0" height="80.0" rx="14.0" fill="#eaf0f2" stroke="#173f58" stroke-width="3" /><text x="500" y="129.0" text-anchor="middle" font-size="32" font-weight="700" fill="#183451" >AI</text><text x="438" y="250" text-anchor="middle" font-size="42" font-weight="700" fill="#183451" >Isolation</text><text x="438" y="296" text-anchor="middle" font-size="32" font-weight="400" fill="#1f2a36" >we live apart</text></g><g class="fragment" ><path d="M584 20 V310" fill="none" stroke="#b5c6cd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="652" cy="121.76" r="11.760000000000002" fill="#eaf0f2" stroke="#173f58" stroke-width="3"/><path d="M631.84 166.0 V153.68 Q631.84 139.12 652 139.12 Q672.16 139.12 672.16 153.68 V166.0 Z" fill="#eaf0f2" stroke="#173f58" stroke-width="3" stroke-linejoin="round"/><rect x="696.0" y="38.0" width="128.0" height="128.0" rx="22.400000000000002" fill="#eaf0f2" stroke="#173f58" stroke-width="3" /><text x="760" y="119.6" text-anchor="middle" font-size="51" font-weight="700" fill="#183451" >AI</text><text x="730" y="250" text-anchor="middle" font-size="42" font-weight="700" fill="#183451" >Inferiority</text><text x="730" y="296" text-anchor="middle" font-size="32" font-weight="400" fill="#1f2a36" >we stay, as the lesser</text></g><g class="fragment" ><path d="M876 20 V310" fill="none" stroke="#b5c6cd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="1026.0" y="92.0" width="80.0" height="80.0" rx="14.0" fill="#fbeadb" stroke="#af5526" stroke-width="3" /><text x="1066" y="143.0" text-anchor="middle" font-size="32" font-weight="700" fill="#9c4a1e" >AI</text><circle cx="992" cy="81.0" r="21.0" fill="#fff" stroke="#af5526" stroke-width="3"/><path d="M956.0 160.0 V138.0 Q956.0 112.0 992 112.0 Q1028.0 112.0 1028.0 138.0 V160.0 Z" fill="#fff" stroke="#af5526" stroke-width="3" stroke-linejoin="round"/><path d="M1028 132 H1024" fill="none" stroke="#af5526" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="1022" y="250" text-anchor="middle" font-size="42" font-weight="700" fill="#9c4a1e" >Integration</text><text x="1022" y="296" text-anchor="middle" font-size="32" font-weight="400" fill="#1f2a36" >we become it</text></g></svg>
