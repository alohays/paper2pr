<svg xmlns="http://www.w3.org/2000/svg" id="w14-hui" viewBox="0 0 1168 384" role="img" aria-labelledby="w14-hui-title w14-hui-desc"><title id="w14-hui-title">Recursion and contingency in a machine</title><desc id="w14-hui-desc">A machine whose result loops back to its own input: recursion. Chance enters from outside and the machine absorbs it instead of discarding it: contingency.</desc><style>#w14-hui text{font-family:inherit}</style><defs><marker id="w14-hui-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#173f58" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="w14-hui-w" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#af5526" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="w14-hui-m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8fa3b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="444" y="150" width="280" height="104" rx="12" fill="#eaf0f2" stroke="#173f58" stroke-width="3" /><text x="584" y="216" text-anchor="middle" font-size="42" font-weight="700" fill="#183451" >Machine</text><path d="M724 180 H840 V62 H328 V180 H432" fill="none" stroke="#173f58" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#w14-hui-a)"/><text x="584" y="46" text-anchor="middle" font-size="42" font-weight="700" fill="#183451" >Recursion</text><text x="584" y="112" text-anchor="middle" font-size="30" font-weight="400" fill="#1f2a36" >its own result comes back as input</text><g class="fragment" ><circle cx="150" cy="232" r="9" fill="#af5526" stroke="#af5526" stroke-width="3" /><circle cx="186" cy="214" r="6" fill="#af5526" stroke="#af5526" stroke-width="3" /><circle cx="176" cy="252" r="5" fill="#af5526" stroke="#af5526" stroke-width="3" /><circle cx="128" cy="262" r="6" fill="#af5526" stroke="#af5526" stroke-width="3" /><path d="M214 232 H432" fill="none" stroke="#af5526" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#w14-hui-w)"/><text x="250" y="322" text-anchor="middle" font-size="42" font-weight="700" fill="#9c4a1e" >Contingency</text><text x="250" y="364" text-anchor="middle" font-size="30" font-weight="400" fill="#1f2a36" >chance is absorbed, not discarded</text></g></svg>
