<svg xmlns="http://www.w3.org/2000/svg" id="w14-card" viewBox="0 0 1168 350" role="img" aria-labelledby="w14-card-title w14-card-desc"><title id="w14-card-title">The AI companies&#x27; safety report card</title><desc id="w14-card-desc">A report card from the FLI AI Safety Index, summer 2026. The best overall grade any company gets is C plus. On existential safety no company is above D plus.</desc><style>#w14-card text{font-family:inherit}</style><defs><marker id="w14-card-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#173f58" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="w14-card-w" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#af5526" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="w14-card-m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8fa3b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="214" y="16" width="740" height="318" rx="18" fill="#fff" stroke="#173f58" stroke-width="3" /><text x="584" y="66" text-anchor="middle" font-size="30" font-weight="600" fill="#56677a" >FLI AI Safety Index · summer 2026</text><path d="M214 92 H954" fill="none" stroke="#b5c6cd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="258" y="176" text-anchor="start" font-size="40" font-weight="400" fill="#1f2a36" >Best overall grade</text><text x="906" y="190" text-anchor="end" font-size="84" font-weight="700" fill="#183451" >C+</text><path d="M244 216 H924" fill="none" stroke="#b5c6cd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g class="fragment" ><text x="258" y="286" text-anchor="start" font-size="40" font-weight="400" fill="#1f2a36" >Existential safety, at best</text><text x="906" y="300" text-anchor="end" font-size="84" font-weight="700" fill="#9c4a1e" >D+</text></g></svg>
