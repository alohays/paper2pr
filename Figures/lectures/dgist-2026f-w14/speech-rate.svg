<svg xmlns="http://www.w3.org/2000/svg" id="w14-wpm" viewBox="0 0 1168 318" role="img" aria-labelledby="w14-wpm-title w14-wpm-desc"><title id="w14-wpm-title">Speech decoded from the brain against natural talk</title><desc id="w14-wpm-desc">Two bars in words per minute. Natural talk is about 160. Speech decoded from the brain averaged 56 for one patient who used the system at home for nearly two years, reported in 2026.</desc><style>#w14-wpm text{font-family:inherit}</style><defs><marker id="w14-wpm-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#173f58" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="w14-wpm-w" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#af5526" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="w14-wpm-m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8fa3b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="402" y="98" text-anchor="end" font-size="42" font-weight="700" fill="#56677a" >Natural talk</text><rect x="430" y="54" width="600" height="64" rx="8" fill="#c3ced6" stroke="#8fa3b0" stroke-width="3" /><text x="1050" y="102" text-anchor="start" font-size="48" font-weight="700" fill="#56677a" >160</text><text x="402" y="218" text-anchor="end" font-size="42" font-weight="700" fill="#183451" >Decoded from the brain</text><rect x="430" y="174" width="210" height="64" rx="8" fill="#173f58" stroke="#173f58" stroke-width="3" /><text x="660" y="222" text-anchor="start" font-size="48" font-weight="700" fill="#183451" >56</text><text x="584" y="296" text-anchor="middle" font-size="32" font-weight="400" fill="#56677a" >words per minute · 2026, one patient at home for two years</text></svg>
