<svg xmlns="http://www.w3.org/2000/svg" id="w14-tail" viewBox="0 0 1168 340" role="img" aria-labelledby="w14-tail-title w14-tail-desc"><title id="w14-tail-title">The average and the tail of a safety record</title><desc id="w14-tail-desc">A distribution with a tall hump on the left and a long thin tail to the right. The hump is the average: 95 percent fewer serious-injury crashes. A marked point far out in the tail is one pedestrian dragged six metres.</desc><style>#w14-tail text{font-family:inherit}</style><defs><marker id="w14-tail-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#173f58" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="w14-tail-w" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#af5526" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="w14-tail-m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8fa3b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><path d="M70 318 C190 318 232 132 330 132 C436 132 470 284 640 302 C820 316 980 317 1100 318 L1100 318 L70 318 Z" fill="#eaf0f2" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /><path d="M70 318 C190 318 232 132 330 132 C436 132 470 284 640 302 C820 316 980 317 1100 318" fill="none" stroke="#173f58" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M60 318 H1108" fill="none" stroke="#8fa3b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="330" y="52" text-anchor="middle" font-size="44" font-weight="700" fill="#183451" >The average</text><text x="330" y="100" text-anchor="middle" font-size="32" font-weight="400" fill="#1f2a36" >95% fewer serious-injury crashes</text><g class="fragment" ><path d="M930 236 V304" fill="none" stroke="#af5526" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/><circle cx="930" cy="312" r="11" fill="#af5526" stroke="#af5526" stroke-width="3" /><text x="930" y="172" text-anchor="middle" font-size="44" font-weight="700" fill="#9c4a1e" >The tail</text><text x="930" y="218" text-anchor="middle" font-size="32" font-weight="400" fill="#1f2a36" >one pedestrian dragged 6 m</text></g></svg>
