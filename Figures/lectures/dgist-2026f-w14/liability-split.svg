<svg xmlns="http://www.w3.org/2000/svg" id="w14-fault" viewBox="0 0 1168 262" role="img" aria-labelledby="w14-fault-title w14-fault-desc"><title id="w14-fault-title">How the jury split the fault</title><desc id="w14-fault-desc">A bar split in two. The driver carries 67 percent of the fault and Tesla 33 percent. The award against Tesla is about 243 million dollars and is on appeal.</desc><style>#w14-fault text{font-family:inherit}</style><defs><marker id="w14-fault-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#173f58" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="w14-fault-w" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#af5526" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="w14-fault-m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8fa3b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="584" y="50" text-anchor="middle" font-size="32" font-weight="400" fill="#56677a" >Jury verdict, August 2025</text><rect x="134" y="84" width="603" height="96" rx="10" fill="#eaf0f2" stroke="#173f58" stroke-width="3" /><text x="435.5" y="146" text-anchor="middle" font-size="46" font-weight="700" fill="#183451" >Driver 67%</text><rect x="737" y="84" width="297" height="96" rx="10" fill="#fbeadb" stroke="#af5526" stroke-width="3" /><text x="885.5" y="146" text-anchor="middle" font-size="46" font-weight="700" fill="#9c4a1e" >Tesla 33%</text><text x="584" y="240" text-anchor="middle" font-size="32" font-weight="400" fill="#1f2a36" >about $243 million against Tesla, now on appeal</text></svg>
