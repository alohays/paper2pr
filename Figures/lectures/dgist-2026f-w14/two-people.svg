<svg xmlns="http://www.w3.org/2000/svg" id="w14-two" viewBox="0 0 1168 410" role="img" aria-labelledby="w14-two-title w14-two-desc"><title id="w14-two-title">Two events in November 2026</title><desc id="w14-two-desc">Left, Korea, 15 November: one candidate scored 100 in the tax-law paper of the tax accountant exam where the average was 30.18. Right, United States, 20 November: 17 million lines of Lean code, a proof of the Riemann Hypothesis found working with Claude.</desc><style>#w14-two text{font-family:inherit}</style><defs><marker id="w14-two-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#173f58" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="w14-two-w" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#af5526" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="w14-two-m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8fa3b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g ><text x="292" y="44" text-anchor="middle" font-size="34" font-weight="600" fill="#56677a" >15 Nov · Korea</text><path d="M96 322 H488" fill="none" stroke="#8fa3b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="150" y="146" width="104" height="176" rx="6" fill="#fbeadb" stroke="#af5526" stroke-width="3" /><text x="202" y="130" text-anchor="middle" font-size="54" font-weight="700" fill="#9c4a1e" >100</text><rect x="340" y="269" width="104" height="53" rx="6" fill="#eaf0f2" stroke="#173f58" stroke-width="3" /><text x="392" y="253" text-anchor="middle" font-size="54" font-weight="700" fill="#183451" >30.18</text><text x="202" y="362" text-anchor="middle" font-size="30" font-weight="400" fill="#1f2a36" >one candidate</text><text x="392" y="362" text-anchor="middle" font-size="30" font-weight="400" fill="#1f2a36" >average</text><text x="292" y="406" text-anchor="middle" font-size="30" font-weight="400" fill="#56677a" >tax-law paper, tax accountant exam</text></g><g class="fragment" ><path d="M584 24 V396" fill="none" stroke="#b5c6cd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="876" y="44" text-anchor="middle" font-size="34" font-weight="600" fill="#56677a" >20 Nov · United States</text><text x="876" y="176" text-anchor="middle" font-size="96" font-weight="700" fill="#183451" >17 million</text><text x="876" y="236" text-anchor="middle" font-size="44" font-weight="700" fill="#183451" >lines of Lean code</text><text x="876" y="310" text-anchor="middle" font-size="30" font-weight="400" fill="#1f2a36" >a proof of the Riemann Hypothesis,</text><text x="876" y="350" text-anchor="middle" font-size="30" font-weight="400" fill="#1f2a36" >found “working with Claude”</text></g></svg>
