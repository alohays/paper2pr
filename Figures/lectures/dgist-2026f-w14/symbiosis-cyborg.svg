<svg xmlns="http://www.w3.org/2000/svg" id="w14-1960" viewBox="0 0 1168 326" role="img" aria-labelledby="w14-1960-title w14-1960-desc"><title id="w14-1960-title">Two ideas from 1960: symbiosis and the cyborg</title><desc id="w14-1960-desc">Left, Licklider&#x27;s man-computer symbiosis: a person and a computer linked as one system. Right, Clynes and Kline&#x27;s cyborg: a person with a device joined to the body.</desc><style>#w14-1960 text{font-family:inherit}</style><defs><marker id="w14-1960-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#173f58" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="w14-1960-w" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#af5526" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="w14-1960-m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8fa3b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g ><circle cx="182" cy="84.15" r="24.15" fill="#eaf0f2" stroke="#173f58" stroke-width="3"/><path d="M140.6 175.0 V149.7 Q140.6 119.8 182 119.8 Q223.4 119.8 223.4 149.7 V175.0 Z" fill="#eaf0f2" stroke="#173f58" stroke-width="3" stroke-linejoin="round"/><path d="M240 132 H320" fill="none" stroke="#173f58" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 12"/><rect x="332" y="72" width="124" height="92" rx="10" fill="#eaf0f2" stroke="#173f58" stroke-width="3" /><rect x="346" y="86" width="96" height="58" rx="4" fill="#fff" stroke="#173f58" stroke-width="3" /><path d="M376 164 V184 M354 186 H434" fill="none" stroke="#173f58" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="292" y="256" text-anchor="middle" font-size="48" font-weight="700" fill="#183451" >Symbiosis</text><text x="292" y="302" text-anchor="middle" font-size="32" font-weight="400" fill="#1f2a36" >Licklider, 1960</text></g><g class="fragment" ><path d="M584 20 V320" fill="none" stroke="#b5c6cd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="876" cy="84.15" r="24.15" fill="#fbeadb" stroke="#af5526" stroke-width="3"/><path d="M834.6 175.0 V149.7 Q834.6 119.8 876 119.8 Q917.4 119.8 917.4 149.7 V175.0 Z" fill="#fbeadb" stroke="#af5526" stroke-width="3" stroke-linejoin="round"/><rect x="894" y="128" width="54" height="54" rx="10" fill="#fff" stroke="#af5526" stroke-width="3" /><path d="M908 155 h26 M921 142 v26" fill="none" stroke="#af5526" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="876" y="256" text-anchor="middle" font-size="48" font-weight="700" fill="#9c4a1e" >Cyborg</text><text x="876" y="302" text-anchor="middle" font-size="32" font-weight="400" fill="#1f2a36" >Clynes and Kline, 1960</text></g></svg>
