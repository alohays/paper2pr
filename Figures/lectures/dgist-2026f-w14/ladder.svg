<svg xmlns="http://www.w3.org/2000/svg" id="w14-ladder" viewBox="0 0 1168 250" role="img" aria-labelledby="w14-ladder-title w14-ladder-desc"><title id="w14-ladder-title">Human, transhuman, posthuman as three steps</title><desc id="w14-ladder-desc">A staircase of three steps: human, then transhuman, then posthuman. The middle step is marked.</desc><style>#w14-ladder text{font-family:inherit}</style><defs><marker id="w14-ladder-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#173f58" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="w14-ladder-w" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#af5526" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="w14-ladder-m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8fa3b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><path d="M214 232 H434 V172 H694 V112 H954" fill="none" stroke="#173f58" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M434 232 H694 V172 H434 Z" fill="#fbeadb" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /><path d="M434 232 V172 H694" fill="none" stroke="#af5526" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="324" y="208" text-anchor="middle" font-size="44" font-weight="700" fill="#183451" >human</text><text x="564" y="148" text-anchor="middle" font-size="44" font-weight="700" fill="#9c4a1e" >transhuman</text><text x="824" y="88" text-anchor="middle" font-size="44" font-weight="700" fill="#183451" >posthuman</text></svg>
