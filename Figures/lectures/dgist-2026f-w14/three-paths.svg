<svg xmlns="http://www.w3.org/2000/svg" id="w14-paths" viewBox="0 0 1168 384" role="img" aria-labelledby="w14-paths-title w14-paths-desc"><title id="w14-paths-title">Three paths for a person in the age of AI</title><desc id="w14-paths-desc">From me, three paths. Hand over to AI: no me remains. Move to a machine at once: nobody knows whether it is still me. Grow step by step: me continues.</desc><style>#w14-paths text{font-family:inherit}</style><defs><marker id="w14-paths-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#173f58" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="w14-paths-w" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#af5526" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="w14-paths-m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8fa3b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g ><circle cx="120" cy="161.2" r="25.2" fill="#eaf0f2" stroke="#173f58" stroke-width="3"/><path d="M76.80000000000001 256.0 V229.6 Q76.80000000000001 198.4 120 198.4 Q163.2 198.4 163.2 229.6 V256.0 Z" fill="#eaf0f2" stroke="#173f58" stroke-width="3" stroke-linejoin="round"/><text x="120" y="300" text-anchor="middle" font-size="40" font-weight="700" fill="#183451" >me</text></g><g ><path d="M196 176 Q380 70 520 70" fill="none" stroke="#173f58" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#w14-paths-a)"/><rect x="538.0" y="34.0" width="72.0" height="72.0" rx="12.6" fill="#eaf0f2" stroke="#173f58" stroke-width="3" /><text x="574" y="79.9" text-anchor="middle" font-size="29" font-weight="700" fill="#183451" >AI</text><text x="640" y="66" text-anchor="start" font-size="42" font-weight="700" fill="#183451" >Hand over to AI</text><text x="640" y="108" text-anchor="start" font-size="32" font-weight="400" fill="#1f2a36" >no “me” remains</text></g><g class="fragment" ><path d="M204 196 H520" fill="none" stroke="#173f58" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#w14-paths-a)"/><rect x="538" y="160" width="72" height="72" rx="12" fill="#eaf0f2" stroke="#173f58" stroke-width="3" /><text x="574" y="210" text-anchor="middle" font-size="42" font-weight="700" fill="#183451" >?</text><text x="640" y="192" text-anchor="start" font-size="42" font-weight="700" fill="#183451" >Move to a machine at once</text><text x="640" y="234" text-anchor="start" font-size="32" font-weight="400" fill="#1f2a36" >is it still “me”? Nobody knows</text></g><g class="fragment" ><path d="M196 216 Q380 322 520 322" fill="none" stroke="#af5526" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#w14-paths-w)"/><circle cx="574" cy="296.38" r="16.38" fill="#fbeadb" stroke="#af5526" stroke-width="3"/><path d="M545.92 358.0 V340.84000000000003 Q545.92 320.56 574 320.56 Q602.08 320.56 602.08 340.84000000000003 V358.0 Z" fill="#fbeadb" stroke="#af5526" stroke-width="3" stroke-linejoin="round"/><text x="640" y="318" text-anchor="start" font-size="42" font-weight="700" fill="#9c4a1e" >Grow step by step</text><text x="640" y="360" text-anchor="start" font-size="32" font-weight="400" fill="#1f2a36" >“me” continues</text></g></svg>
