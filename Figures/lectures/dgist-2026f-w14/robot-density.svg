<svg xmlns="http://www.w3.org/2000/svg" id="w14-density" viewBox="0 0 1168 320" role="img" aria-labelledby="w14-density-title w14-density-desc"><title id="w14-density-title">Robot density in manufacturing, Korea and the world average</title><desc id="w14-density-desc">Two horizontal bars. Korea: 1,220 robots per 10,000 factory workers. World average: 132.</desc><style>#w14-density text{font-family:inherit}</style><defs><marker id="w14-density-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#173f58" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="w14-density-w" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#af5526" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="w14-density-m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8fa3b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="372" y="96" text-anchor="end" font-size="44" font-weight="700" fill="#183451" >Korea</text><rect x="400" y="52" width="640" height="64" rx="8" fill="#173f58" stroke="#173f58" stroke-width="3" /><text x="1062" y="100" text-anchor="start" font-size="48" font-weight="700" fill="#183451" >1,220</text><text x="372" y="216" text-anchor="end" font-size="44" font-weight="700" fill="#56677a" >World average</text><rect x="400" y="172" width="69" height="64" rx="8" fill="#c3ced6" stroke="#8fa3b0" stroke-width="3" /><text x="491" y="220" text-anchor="start" font-size="48" font-weight="700" fill="#56677a" >132</text><text x="584" y="296" text-anchor="middle" font-size="32" font-weight="400" fill="#56677a" >robots per 10,000 factory workers</text></svg>
