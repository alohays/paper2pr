<svg xmlns="http://www.w3.org/2000/svg" id="w14-agent" viewBox="0 0 1168 326" role="img" aria-labelledby="w14-agent-title w14-agent-desc"><title id="w14-agent-title">Calculator, thermostat, learning agent</title><desc id="w14-agent-desc">A calculator has no goal. A thermostat has one closed goal, 22 degrees. A learning agent maximizes its reward by any path it finds.</desc><style>#w14-agent text{font-family:inherit}</style><defs><marker id="w14-agent-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#173f58" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="w14-agent-w" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#af5526" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="w14-agent-m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8fa3b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g ><rect x="147" y="40" width="96" height="150" rx="12" fill="#eaf0f2" stroke="#173f58" stroke-width="3" /><rect x="161" y="54" width="68" height="38" rx="6" fill="#fff" stroke="#173f58" stroke-width="3" /><circle cx="173" cy="126" r="5" fill="#173f58" stroke="#173f58" stroke-width="3" /><circle cx="173" cy="148" r="5" fill="#173f58" stroke="#173f58" stroke-width="3" /><circle cx="173" cy="170" r="5" fill="#173f58" stroke="#173f58" stroke-width="3" /><circle cx="195" cy="126" r="5" fill="#173f58" stroke="#173f58" stroke-width="3" /><circle cx="195" cy="148" r="5" fill="#173f58" stroke="#173f58" stroke-width="3" /><circle cx="195" cy="170" r="5" fill="#173f58" stroke="#173f58" stroke-width="3" /><circle cx="217" cy="126" r="5" fill="#173f58" stroke="#173f58" stroke-width="3" /><circle cx="217" cy="148" r="5" fill="#173f58" stroke="#173f58" stroke-width="3" /><circle cx="217" cy="170" r="5" fill="#173f58" stroke="#173f58" stroke-width="3" /><text x="195" y="256" text-anchor="middle" font-size="44" font-weight="700" fill="#183451" >Calculator</text><text x="195" y="304" text-anchor="middle" font-size="34" font-weight="400" fill="#1f2a36" >no goal</text></g><g class="fragment" ><path d="M322 115 H432" fill="none" stroke="#8fa3b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#w14-agent-m)"/><circle cx="584" cy="115" r="74" fill="#eaf0f2" stroke="#173f58" stroke-width="3" /><circle cx="584" cy="115" r="54" fill="#fff" stroke="#173f58" stroke-width="3" /><text x="584" y="129" text-anchor="middle" font-size="40" font-weight="700" fill="#183451" >22°</text><text x="584" y="256" text-anchor="middle" font-size="44" font-weight="700" fill="#183451" >Thermostat</text><text x="584" y="304" text-anchor="middle" font-size="34" font-weight="400" fill="#1f2a36" >one closed goal</text></g><g class="fragment" ><path d="M716 115 H826" fill="none" stroke="#8fa3b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#w14-agent-m)"/><path d="M915 154 A70 70 0 1 1 1007 176" fill="none" stroke="#af5526" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#w14-agent-w)"/><text x="973" y="104" text-anchor="middle" font-size="40" font-weight="700" fill="#9c4a1e" >↑</text><text x="973" y="140" text-anchor="middle" font-size="28" font-weight="600" fill="#9c4a1e" >reward</text><text x="973" y="256" text-anchor="middle" font-size="44" font-weight="700" fill="#9c4a1e" >Learning agent</text><text x="973" y="304" text-anchor="middle" font-size="34" font-weight="400" fill="#1f2a36" >maximize, by any path</text></g></svg>
