<svg xmlns="http://www.w3.org/2000/svg" id="w14-rules" viewBox="0 0 1168 320" role="img" aria-labelledby="w14-rules-title w14-rules-desc"><title id="w14-rules-title">Who the rule is written for, 1942 to 2024</title><desc id="w14-rules-desc">A timeline with three points. 1942, Asimov: three laws for the robot. 2011, EPSRC: people are responsible. 2024, AutoRT: rules in the prompt and a physical kill switch.</desc><style>#w14-rules text{font-family:inherit}</style><defs><marker id="w14-rules-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#173f58" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="w14-rules-w" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#af5526" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="w14-rules-m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8fa3b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><path d="M90 150 H1078" fill="none" stroke="#b5c6cd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><g ><text x="200" y="104" text-anchor="middle" font-size="40" font-weight="700" fill="#56677a" >1942</text><circle cx="200" cy="150" r="13" fill="#173f58" stroke="#173f58" stroke-width="3" /><text x="200" y="232" text-anchor="middle" font-size="50" font-weight="700" fill="#183451" >Asimov</text><text x="200" y="284" text-anchor="middle" font-size="32" font-weight="400" fill="#1f2a36" >three laws for the robot</text></g><g class="fragment" ><text x="584" y="104" text-anchor="middle" font-size="40" font-weight="700" fill="#56677a" >2011</text><circle cx="584" cy="150" r="13" fill="#173f58" stroke="#173f58" stroke-width="3" /><text x="584" y="232" text-anchor="middle" font-size="50" font-weight="700" fill="#183451" >EPSRC</text><text x="584" y="284" text-anchor="middle" font-size="32" font-weight="400" fill="#1f2a36" >people are responsible</text></g><g class="fragment" ><text x="968" y="104" text-anchor="middle" font-size="40" font-weight="700" fill="#56677a" >2024</text><circle cx="968" cy="150" r="13" fill="#173f58" stroke="#173f58" stroke-width="3" /><text x="968" y="232" text-anchor="middle" font-size="50" font-weight="700" fill="#183451" >AutoRT</text><text x="968" y="284" text-anchor="middle" font-size="32" font-weight="400" fill="#1f2a36" >prompt rules and a kill switch</text></g></svg>
