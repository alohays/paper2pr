    <path class="scene" d="M200 216 V73 H254 V216"/>
    <path d="M219 140 H237" stroke="#9a752f" stroke-width="7" stroke-linecap="round"/>
    <rect x="109" y="65" width="31" height="31" rx="10" fill="#233f66"/>
    <path d="M102 105 Q124 98 149 106 L142 145 H112 Z" fill="#233f66"/>
    <path class="link" d="M110 114 L90 143 L97 156 M145 115 L167 146 L207 140 M117 145 L107 174 L102 208 H89 M136 145 L150 174 L150 208 H163"/>
    <path class="tool" d="M208 140 L214 135 H221 M208 140 L216 145 H222"/>
    <text class="task" x="144" y="266">Use a door lever</text>
  </g>
</svg>
