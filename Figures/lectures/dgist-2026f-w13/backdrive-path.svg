<svg xmlns="http://www.w3.org/2000/svg" id="w13-backdrive-path" viewBox="0 0 1020 325" role="img" aria-labelledby="w13-backdrive-title w13-backdrive-desc">
  <title id="w13-backdrive-title">A push at the foot can turn the motor shaft</title>
  <desc id="w13-backdrive-desc">Viewed along the two shafts, the leg is attached to the large gear. An upward ground force begins at the contact under the foot. It tends to rotate the leg counterclockwise about the joint and the smaller motor gear clockwise.</desc>
