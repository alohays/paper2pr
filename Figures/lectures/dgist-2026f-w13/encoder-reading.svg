<svg xmlns="http://www.w3.org/2000/svg" id="w13-encoder-reading" viewBox="0 0 1100 322" role="img" aria-labelledby="w13-encoder-reading-title w13-encoder-reading-desc">
  <title id="w13-encoder-reading-title">From shaft rotation to an encoder reading</title>
  <desc id="w13-encoder-reading-desc">As a marked shaft rotates, the fixed reader produces a pulse at each passing mark. Counting pulses from a known reference measures the change in angle.</desc>
  <style>
    #w13-encoder-reading text {font-family:inherit;fill:#183451}
    #w13-encoder-reading .heading {font-size:34px;font-weight:700}
    #w13-encoder-reading .label {font-size:28px}
    #w13-encoder-reading .line {fill:none;stroke:#233f66;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <text class="heading" x="255" y="38" text-anchor="middle">Shaft turns</text>
  <circle cx="255" cy="150" r="89" stroke="#8193a5" stroke-width="3" fill="#eff4f8"/>
  <path d="M329.0 150.0 l14.0 0.0 M325.4 172.9 l13.3 4.3 M314.9 193.5 l11.3 8.2 M298.5 209.9 l8.2 11.3 M277.9 220.4 l4.3 13.3 M255.0 224.0 l0.0 14.0 M232.1 220.4 l-4.3 13.3 M211.5 209.9 l-8.2 11.3 M195.1 193.5 l-11.3 8.2 M184.6 172.9 l-13.3 4.3 M181.0 150.0 l-14.0 0.0 M184.6 127.1 l-13.3 -4.3 M195.1 106.5 l-11.3 -8.2 M211.5 90.1 l-8.2 -11.3 M232.1 79.6 l-4.3 -13.3 M255.0 76.0 l-0.0 -14.0 M277.9 79.6 l4.3 -13.3 M298.5 90.1 l8.2 -11.3 M314.9 106.5 l11.3 -8.2 M325.4 127.1 l13.3 -4.3" fill="none" stroke="#244c72" stroke-width="6"/>
  <circle cx="255" cy="150" r="15" fill="#234766"/>
  <path d="M248 101 Q303 98 305 151 M293 139 L305 151 L314 135" fill="none" stroke="#94651b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M349 136 H393 V164 H349 Z" fill="#c99642" stroke="#77531d" stroke-width="3"/>
  <text class="label" x="255" y="290" text-anchor="middle">Marks pass a fixed reader.</text>
  <path d="M456 152 H565 M551 140 L565 152 L551 164" class="line"/>
  <text class="heading" x="806" y="38" text-anchor="middle">Pulses arrive</text>
  <path d="M630 180 H657 V112 H689 V180 H731 V112 H763 V180 H805 V112 H837 V180 H879 V112 H911 V180 H959" class="line"/>
  <text class="label" x="806" y="290" text-anchor="middle">Count from a known angle.</text>
</svg>
