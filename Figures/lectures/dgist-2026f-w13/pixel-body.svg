    #w13-pixel-body .label { font: 650 42px var(--r-main-font, Helvetica, Arial, sans-serif); fill: #203752 }
    #w13-pixel-body .leader { fill: none; stroke: #778b9e; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round }
    #w13-pixel-body .rim { stroke: #273b50; stroke-width: 3; stroke-linejoin: round }
    #w13-pixel-body .arm { fill: none; stroke: #28394b; stroke-width: 17; stroke-linecap: round; stroke-linejoin: round }
    #w13-pixel-body .shell { fill: none; stroke: #b3c2ce; stroke-width: 9; stroke-linecap: round }
    #w13-pixel-body .jaw { fill: none; stroke: #c77c23; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round }
  </style>

