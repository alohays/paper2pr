<svg xmlns="http://www.w3.org/2000/svg" id="w13-pixel-body" viewBox="0 0 900 398" role="img" aria-labelledby="w13-pixel-title w13-pixel-desc">
  <title id="w13-pixel-title">Pixel's arms and wheeled base</title>
  <desc id="w13-pixel-desc">Front view of the research platform. Two jointed arms end in orange grippers. A vertical lift connects the torso to a box-shaped mobile base, with its near wheels shown below the chassis.</desc>
