  <title id="w13-pair-title">Count the marked teeth on two meshed gears</title>
  <desc id="w13-pair-desc">The small motor gear has 12 teeth and the large joint gear has 36. Each advance turns the motor once clockwise. The joint turns one third of a revolution counterclockwise.</desc>
