<svg xmlns="http://www.w3.org/2000/svg" id="w13-delay-response" viewBox="0 0 1152 344" role="img" aria-labelledby="w13-delay-title w13-delay-desc">
  <title id="w13-delay-title">Position of a simulated mass after a one-metre target is set</title>
  <desc id="w13-delay-desc">The left trace reaches 1.16 metres with a current sensor reading. With a quarter-second sensor delay, the right trace reaches 1.32 metres. Both plots show the first five seconds at the same scale and with identical controller settings.</desc>
  <style>
    #w13-delay-response text { font-family: inherit; fill: #183451 }
    #w13-delay-response .panel { font-size: 34px; font-weight: 700 }
    #w13-delay-response .target, #w13-delay-response .tick { font-size: 25px }
    #w13-delay-response .peak-label { font-size: 27px; font-weight: 700 }
    #w13-delay-response .axis { stroke: #8494a5; stroke-width: 2; fill: none }
    #w13-delay-response .goal { stroke: #765a29; stroke-width: 3; stroke-dasharray: 9 7; fill: none }
    #w13-delay-response .trace { stroke: #184e81; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; fill: none }
    #w13-delay-response .peak { fill: #184e81 }
  </style>
  <!-- W13 FeedbackLab. Target 1 m, Kp 1.8, Kd 0.55, disturbance 0, force limit 4 N. Each trace samples the model at 50 ms and retains the exact peak. -->
