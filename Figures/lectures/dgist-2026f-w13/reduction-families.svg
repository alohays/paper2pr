  <text class="head" x="561" y="40">Strain wave</text>
  <text class="sub" x="561" y="284">A flexible ring goes oval.</text>
  <text class="head" x="935" y="40">Cycloidal</text>
  <text class="sub" x="935" y="284">A disc wobbles among pins.</text>
