  <title id="w13-reduction-families-title">Three ways to reduce speed</title>
  <desc id="w13-reduction-families-desc">Schematic views show a planetary set with a sun and three planets, a strain-wave reducer with a flexible oval ring contacting a rigid ring, and an eccentric cycloidal disc inside a circle of pins.</desc>
