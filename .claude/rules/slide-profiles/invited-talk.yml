profile: invited-talk
label: Invited talk
genre_default: talks

audience:
  assumes: practitioner      # none | practitioner | expert
  description: >
    Varies by invitation, which is exactly why this profile declares less
    than the other two. Set audience.assumes in the deck's own config when
    you know the room; the interview asks for it.
duration_min: 45

bullets:
  max_per_slide: 5
  max_with_figure: 3
  max_two_line: 1

checks:
  font_shrink: forbid
  box_density: 1
  max_nesting: 1
  expand_acronyms: false
  prior_session_callback: false

guidance: |
  The length and the room both move, so pin them in the deck config before
  writing rather than discovering them in the last rehearsal.

  A talk carries an argument, not a survey. Whatever the host asked for,
  there should be one claim a listener could repeat afterwards.

  This is the profile most likely to leak internal material, because the
  work being described is usually current. Check the deck against what is
  actually public before it ships.
