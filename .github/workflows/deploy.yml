name: Deploy slides to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      # Every step below is a script, so the whole pipeline can be run locally
      # before pushing. Only directories listed in Quarto/_genres.txt are
      # rendered and published, which is why the theme regression fixture in
      # Quarto/_fixtures/ cannot ship to /slides/ by being forgotten about.
      #
      # Inline shell here has failed twice in ways nothing local could catch:
      # loose runtime assets silently not copied, and a loop that returned 1
      # because a genre directory was empty. A step that only ever executes on
      # CI is a step nobody can test before pushing.

      - name: Render decks
        run: bash scripts/render_decks.sh

      - name: Strip speaker notes from HTML (safety net)
        run: bash scripts/strip_notes.sh Quarto

      - name: Assemble site
        run: bash scripts/assemble_site.sh _site

      - name: Check every referenced local asset made it into the site
        run: python3 scripts/check_site_assets.py _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
