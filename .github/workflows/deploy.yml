name: Deploy slides to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Resolve deck genres
        id: genres
        run: |
          # Only directories listed in Quarto/_genres.txt are rendered and
          # published. That replaces the old name-based skip list: the theme
          # regression fixture now lives in Quarto/_fixtures/, which is not a
          # genre, so it cannot ship to /slides/ by being forgotten about.
          genres=$(grep -vE '^\s*(#|$)' Quarto/_genres.txt | tr '\n' ' ')
          echo "list=$genres" >> "$GITHUB_OUTPUT"
          echo "Genres: $genres"

      - name: Render Quarto slides
        # Through the environment, not `${{ }}` inside the script. GitHub
        # pastes an expression into the shell as text, so a genre list is one
        # edit away from being read as shell.
        env:
          GENRES: ${{ steps.genres.outputs.list }}
        run: |
          for genre in $GENRES; do
            for qmd in Quarto/"$genre"/*.qmd; do
              [ -f "$qmd" ] || continue
              case "$(basename "$qmd")" in
                *_backup*) echo "Skipping $qmd"; continue ;;
              esac
              echo "Rendering $qmd..."
              quarto render "$qmd"
            done
          done

      - name: Strip speaker notes from HTML (safety net)
        env:
          GENRES: ${{ steps.genres.outputs.list }}
        run: |
          for genre in $GENRES; do
            for html in Quarto/"$genre"/*.html; do
              [ -f "$html" ] && python3 scripts/strip_speaker_notes.py "$html"
            done
          done

      - name: Assemble site
        run: bash scripts/assemble_site.sh _site

      - name: Check every referenced local asset made it into the site
        run: python3 scripts/check_site_assets.py _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
