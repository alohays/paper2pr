name: Deploy slides to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      # Every step below is a script, so the whole pipeline can be run locally
      # before pushing. Only directories listed in Quarto/_genres.txt are
      # eligible, and a deck with `publish: false` in its .deck.yml is left
      # out of the Pages render and landing page. This is why the theme
      # regression fixture in Quarto/_fixtures/ cannot ship to /slides/ by
      # being forgotten about.
      #
      # Inline shell here has failed twice in ways nothing local could catch:
      # loose runtime assets silently not copied, and a loop that returned 1
      # because a genre directory was empty. A step that only ever executes on
      # CI is a step nobody can test before pushing.

      - name: Render decks
        run: bash scripts/render_decks.sh

      - name: Strip speaker notes from HTML (safety net)
        run: bash scripts/strip_notes.sh Quarto

      - name: Assemble site
        run: bash scripts/assemble_site.sh _site

      - name: Check every referenced local asset made it into the site
        run: python3 scripts/check_site_assets.py _site

      # The asset check above skips external URLs by design, so the one state
      # it cannot see is a page whose Release URLs are well-formed and answer
      # 404 because media_release.sh was never run. For every deck selected
      # for Paper2PR Pages, merging publishes it here, and a missing release
      # reaches the room as a black slide.
      - name: Check the Release media the pages point at actually exists
        run: python3 scripts/check_release_media.py _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
