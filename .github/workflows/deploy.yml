name: Verify and publish slides

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: quarto
        name: Read the local Quarto pin
        run: echo "version=$(cat .quarto-version)" >> "$GITHUB_OUTPUT"

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ steps.quarto.outputs.version }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'

      - name: Install verification dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg poppler-utils qrencode
          python -m pip install -r requirements-qa.txt
          npm ci
          bash scripts/setup-git-filters.sh

      - name: Verify the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
        run: ./verify --changed-from "$BASE_REVISION" --regressions --site _site

      - name: Verify the full site
        if: github.event_name != 'pull_request'
        run: ./verify --all --regressions --site _site

      - name: Archive the checked audience site
        if: hashFiles('_site/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
