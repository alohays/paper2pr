# Written by /new-deck. These are the premises the deck was built on;
# every downstream tool reads them from here rather than guessing.
#   quality_score.py  -> bullet budget and the profile's extra checks
#   the Korean gate   -> whether non-English slides are allowed here,
#                        and how much Hangul an English deck may carry
#   write-speaker-notes -> which language the notes are in, and the
#                        speaking minutes the script is budgeted on
#   slide-excellence  -> audience, delivery, sources (review context)
# Changing a value here changes how the deck is graded, so change it
# when the premise changes, not to make a warning go away.
profile: lecture
title: "Foundations of Robot Hardware, Control, and Modern Platforms"

# audience.assumes, audience.size, audience.prior and delivery are
# context for the review agents (slide-excellence reads them), not
# consumed by the gate; the gate's budget and checks come from the
# profile above.
audience:
  assumes: none    # none | practitioner | expert
  size: "about 90"
  description: "Returning first-year undergraduates in their second semester. Open directly from the course work on robot learning and data collection. Give the opening film its answer on the same screen. Survey arms, mobile manipulators, quadrupeds and humanoids from the perspective of a robot-learning researcher. Introduce each term through an observable action. Use the original English technical name in the slides, Korean notes and visual guide. At first teaching use, explain it in plain Korean with a physical example. Teach each example from the scene on screen. A short reminder may follow a new example. Assume no recall of earlier examples and no mechanics or control course."
  prior: [W02 embodied AI and policy, W06 drawer commands and timestamped robot state, W09 timed action targets and inference delay]
delivery: in-person    # in-person | remote | hybrid

# Wall-clock minutes. video_min (clips playing without narration) and
# qa_min (questions) are subtracted: the speaker-notes budget runs on
# speaking_min = duration_min - video_min - qa_min.
duration_min: 60
video_min: 1  # Rounded quiet viewing time within the 50-minute teaching slot.
qa_min: 10

language:
  slides: en
  notes: ko
  # korean_allowance: <n>  -- max Hangul characters on English slides
  # (term glosses, Wooclap instructions). Omit to take the profile's
  # default (lecture 300, others 0). Slides declared ko are not counted.

