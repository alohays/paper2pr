# Series file for the DGIST HSS118 course (2026 Fall). One file per course,
# at Quarto/lectures/_series/<course>.yml; the directory is underscore-
# prefixed, so Quarto never renders anything in it as a deck.
#
# Read by scripts/series_assets.py (writes the lock Figures/lectures/_series/
# <course>/series.json plus the QR and semester-map images the shared slides
# use), scripts/deckprofile.py (a deck that declares `series:` and
# `series_index:` in its deck.yml resolves its session and the prior session
# from here), scripts/new_deck.py (--series / --series-index prefill the
# title and date) and scripts/build_landing.py (groups the lecture decks).
# Parsed with scripts/minyaml.py: plain nested mappings, block sequences and
# quoted scalars only (no flow mappings, no anchors). Dates are quoted so
# that PyYAML and minyaml read the same string.
#
# Schema
#   course        course name                              string
#   code          course code                              string
#   term          term                                     string
#   institution   institution                              string
#   room, time    where and when the class meets           strings
#   instructor    the presenter                            string
#   co_instructor co-instructor, with role                 string
#   course_page   public course page URL                   string
#   lms_note      one line telling students where the official record lives
#   qa_tool       name, url, code, note: the question wall the QR points at.
#                 url/code are PLACEHOLDER until the event exists; replace
#                 them and re-run scripts/series_assets.py <course>
#   rules         short lines for the "How this course runs" slide
#   notation      policy (the one symbol reused every week), note
#   sessions      exactly one mapping per week, in order:
#     index       1..N, unique, the week number (W02 = index 2)
#     date        YYYY-MM-DD, quoted, must be the course weekday (a Friday)
#     kind        lecture | guest | keynote | dgist | holiday | exam
#     title       full session title (said aloud; the semester map prints
#                 only dates and kind tags, never titles)
#     presenter   name, or "" when DGIST arranges the session
#     deck        deck name for a session that has one, else "" (a planned
#                 name is fine: the resolver tolerates a deck that does not
#                 exist yet)
#     remote      true when the presenter joins remotely (optional)
#     tentative   true when the slot is not confirmed (optional)
#
# Derived by series_assets.py into the lock, never written here: week label
# ("W02"), short date ("Sep 4"), prior_index (nearest earlier session that is
# not a holiday or exam week; a guest or DGIST session counts).
course: Future Literacy
code: HSS118
term: 2026 Fall
institution: DGIST
room: E7-233
time: "Fridays 13:00-14:00"
instructor: Yunsung Lee
co_instructor: "Chris (Hongseop) Choi, CEO, Maum AI"
course_page: https://alohays.github.io/teaching/dgist-hss118-2026f/
lms_note: "Official notices, assignments, deadlines and grades live on the DGIST LMS."

qa_tool:
  name: Wooclap
  url: https://app.wooclap.com/PLACEHOLDER
  code: PLACEHOLDER
  note: "replace url and code once the Message wall event exists; re-run scripts/series_assets.py"

rules:
  - "Attendance: every session"
  - "Midterm: a reflection report. Final: a synthesis essay"
  - "Notices, deadlines, grades: the LMS"
  - "Questions: scan the QR any time; answers in the last 10 minutes"

notation:
