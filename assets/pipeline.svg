<svg xmlns="http://www.w3.org/2000/svg" width="980" height="480" viewBox="0 0 980 480" role="img" aria-label="Deck lifecycle: manifests and project defaults feed quarto render; the rendered deck passes the quality gate, is pushed to main, rebuilt by CI and published to GitHub Pages; media lives on a GitHub Release, speaker notes and the PDF handout stay local.">
